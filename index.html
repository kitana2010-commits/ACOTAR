he moment they were tested. He is not cruel by nature. He is simply small in the ways that matter most."]]}]},{"t":"Lore","p":[{"segs":[["A mortal lord’s son who was engaged to "],["Elain Archeron","elain"],[" before the war. When "],["Elain","elain"],[" was forcibly transformed into High Fae by the King of "],["Hybern","king-of-hybern"],[", Graysen broke off their engagement. He could not — or would not — accept what she had become. His father was part of the "],["human","mortal-lands"],[" resistance against "],["Hybern","king-of-hybern"],[" during the war. Graysen’s rejection of Elain is one of the cleaner cuts in her story — not because it didn’t hurt but because it clarified everything about who he was. He has not reappeared in Prythian’s politics since."]]}]}],"back":[]},{"id":"nephelle","n":"Nephelle","c":"characters","k":"night","f":5,"d":5,"sub":[["Ancient "],["Illyrian","illyrians"],[" Warrior — Historical Figure"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Unknown. No physical description survives in reliable detail."]]}]},{"t":"Personality","p":[{"segs":[["Nephelle was considered the weakest of her graduating class of "],["Illyrian","illyrians"],[" warriors — overlooked, underestimated, and dismissed by those who measured worth only by conventional "],["Illyrian","illyrians"],[" standards. She became something else entirely."]]}]},{"t":"Lore","p":[{"segs":[["An ancient "],["Illyrian","illyrians"],[" warrior whose story is considered one of the most significant in "],["Illyrian","illyrians"],[" history. Was regarded as the least promising warrior of her class. Went on to perform an act of such extraordinary courage and consequence that her name survived millennia when most others did not. The specifics of what she did are told as a story within "],["Illyrian","illyrians"],[" culture — passed down not as legend but as proof that strength is not always what it appears to be and that the least likely person in the room is sometimes the one who changes everything. Her story was told by "],["Azriel","azriel"],[" and is considered particularly significant to those who have ever been told they were not enough."]]}]}],"back":[]},{"id":"drakon-miryam","n":"Drakon & Miryam","c":"characters","k":null,"f":3,"d":3,"sub":[["Co-rulers of Cretea — Seraphim Prince and Liberated Queen"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Drakon is winged — a Seraphim prince whose bearing marks him immediately as something apart from Prythian’s courts. Miryam is half High Fae, half "],["human","mortal-lands"],[" — her mixed heritage visible in her features."]]}]},{"t":"Personality","p":[{"segs":[["Two people shaped entirely by war and its aftermath who chose to build something instead of continuing to fight. Drakon is steadfast and principled to the point of having sacrificed everything for it. Miryam is driven and fierce, with a courage that has never once waited for permission. Together they are something the war did not manage to destroy — proof that some things survive it."]]}]},{"t":"Lore","p":[{"segs":[["Met when Miryam was gifted to Drakon as an engagement present by the Black Queen — an act that horrified him enough to help her escape immediately. Both fought in the War. Were reported dead afterward — a deliberate deception that allowed them to disappear to Cretea with fifty thousand liberated "],["humans","mortal-lands"],[". Miryam died in the final sea battle and was resurrected by a "],["Cauldron","cauldron"],["-made object, made immortal in the process. They have ruled Cretea together ever since, hidden from the world by choice."]]}]}],"back":[]},{"id":"enalius","n":"Enalius","c":"characters","k":"night","f":5,"d":5,"sub":[["First "],["Illyrian","illyrians"],[" Warrior — Historical Figure, Deity"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Unknown. No physical description survives. He exists in "],["Illyrian","illyrians"],[" culture as something between historical figure and god — the details of his appearance long since absorbed into myth."]]}]},{"t":"Personality","p":[{"segs":[["Enalius is not remembered for subtlety or strategy. He is remembered for one thing — he held when no one else could, and he held until it killed him. That is the entirety of his legend and it has proven sufficient to outlast everything else."]]}]},{"t":"Lore","p":[{"segs":[["The first and greatest "],["Illyrian","illyrians"],[" warrior. During a battle of civilizational consequence he held the Pass of "],["Ramiel","illyrian-mountains"],[" alone against enemy hordes for three days — preventing them from breaching the mountain and reaching what lay beyond. He climbed to the sacred monolith at "],["Ramiel","illyrian-mountains"],["’s summit with his guts hanging out before dying there. The Pass now bears his name. The "],["Blood Rite","blood-rite"],[" exists in his honor — "],["Illyrian","illyrians"],[" warriors climb "],["Ramiel","illyrian-mountains"],[" and touch that same monolith as the ultimate proof of their warriorhood, retracing the final steps of the male who defined what an "],["Illyrian","illyrians"],[" warrior is supposed to be. He is not merely historical. In "],["Illyrian","illyrians"],[" culture he is sacred."]]}]}],"back":["blood-rite"]},{"id":"dusk-court","n":"The Dusk Court","c":"places","k":null,"f":6,"d":6,"sub":[["Lost Court — Prythian"]],"rows":[{"l":"High Lord","v":[["Unknown. No confirmed ruler survives in reliable record"]]}],"sec":[{"t":"Geography","p":[{"segs":[["Unknown. Its location within Prythian is not confirmed in surviving record."]]}]},{"t":"People","p":[{"segs":[["The Fae of the Dusk Court were among those who eventually left Prythian entirely — migrating to another world through the Horn, a relic capable of opening rifts between worlds. What they built there became something distinct from what they left behind."]]}]},{"t":"Notable","p":[{"segs":[["The Dusk Court is the eighth court of Prythian — older than the current seven and no longer counted among them. Its existence has been largely scrubbed from Prythian’s official history. Its connection to "],["Theia","theia"],["’s bloodline and to the events surrounding the "],["Daglan","daglan"],[" era make it one of the most historically significant courts that most inhabitants of Prythian do not know existed. What remains of it — if anything — is unknown. What left with its people when they migrated still exists somewhere. Whether the court itself could ever be restored is an open question that has not yet been answered."]]}]}],"back":[]},{"id":"koscheis-lake","n":"Koschei’s Lake","c":"places","k":null,"f":3,"d":3,"sub":[["The Continent — Exact location undisclosed"]],"rows":[{"l":"Ruler","v":[["Koschei"]]}],"sec":[{"t":"Geography","p":[{"segs":[["A lake on the Continent, unremarkable in appearance from a distance. Up close it is something else — the water holds a quality that does not belong to ordinary bodies of water. The land around it feels claimed."]]}]},{"t":"Notable","p":[{"segs":[["Koschei is bound to this lake by wards that confine him to its shores. It is simultaneously his prison and his seat of power — he cannot leave but nothing that comes within his reach is safe. "],["Vassa","vassa"],[" is bound here by her curse, returning to the lake each dawn when the firebird transformation takes hold and remaining until nightfall returns her to herself. The lake is not a place to approach without extraordinary power or extraordinary foolishness. Koschei’s confinement does not make it safe — it makes it the most concentrated point of his influence in the world."]]}]}],"back":["koschei"]},{"id":"jesminda","n":"Jesminda","c":"characters","k":"autumn","f":1,"d":1,"sub":[["Autumn Court","autumn-court"],[" Fae — Deceased"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Unknown. No physical description survives in reliable detail."]]}]},{"t":"Personality","p":[{"segs":[["Warm and genuine enough that "],["Lucien","lucien"],[" loved her completely and has never fully stopped. Beyond that, she is known only through the shape of the grief she left behind."]]}]},{"t":"Lore","p":[{"segs":[["A Fae female of the "],["Autumn Court","autumn-court"],[" who loved "],["Lucien Vanserra","lucien"],[". Was murdered by "],["Beron Vanserra","beron"],["’s lords when the relationship was discovered — her death deemed necessary to punish "],["Lucien","lucien"],[" for loving beneath his station. "],["Lucien","lucien"],[" killed the lord responsible and was exiled from the "],["Autumn Court","autumn-court"],[" for it. Jesminda is the wound underneath everything "],["Lucien","lucien"],[" is — the reason he left, the reason he stayed gone, and the measure against which everything that came after has been quietly compared."]]}]}],"back":[]},{"id":"nyx","n":"Nyx","c":"characters","k":"night","f":5,"d":5,"sub":[["Son of "],["Rhysand","rhysand"],[" and "],["Feyre","feyre"],[" — "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Born with small "],["Illyrian","illyrians"],[" wings — a surprise given that only half of his heritage is "],["Illyrian","illyrians"],[". Dark hair. Eyes that have not yet settled into their final color. Tiny and fierce from his first breath."]]}]},{"t":"Personality","p":[{"segs":[["Too young to have established a defined personality within the known events of Prythian’s history. What is known is that he was fought for before he was born and loved before he had a name."]]}]},{"t":"Lore","p":[{"segs":[["Son of "],["Rhysand","rhysand"],[" and "],["Feyre","feyre"],[" — High Lord and High Lady of the "],["Night Court","night-court"],[". His birth was extraordinarily dangerous; his "],["Illyrian","illyrians"],[" wings made delivery nearly fatal for "],["Feyre","feyre"],[". He survived. So did she. His existence is politically significant — the first child born to a High Lord and High Lady in Prythian’s history, carrying the blood of every court through "],["Feyre","feyre"],[" and the full power of the "],["Night Court","night-court"],[" through "],["Rhysand","rhysand"],[". What he will become is unknown. That he will be formidable is not seriously in question by anyone who knows his parents."]]}]}],"back":[]},{"id":"bog-of-oorid","n":"The Bog of Oorid","c":"places","k":null,"f":3,"d":3,"sub":[["Location — The Middle, Prythian"]],"rows":[],"sec":[{"t":"Geography","p":[{"segs":[["A vast, lightless bog situated in the heart of the Middle. Ancient trees grow so thick overhead that no sunlight reaches the water below. The air is heavy, wrong, and smells of rot and something older than rot."]]}]},{"t":"Notable","p":[{"segs":[["The Bog of Oorid is one of the most dangerous locations in Prythian. It is home to "],["kelpies","lesser-fae"],[", lightsingers, and things that have no name and no interest in being named. It does not belong to any court and no court claims it. The creatures that inhabit it do not distinguish between trespassers and prey — the distinction does not exist there. Entering the Bog without extraordinary power or extraordinary preparation is considered suicidal by anyone in Prythian who knows what lives in it."]]}]}],"back":[]},{"id":"lanthys","n":"Lanthys","c":"creatures","k":"night","f":5,"d":5,"sub":[["Ancient Being — The "],["Prison","the-prison"],[", Prythian"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Beautiful and terrible in equal measure — the kind of appearance that has been used as a weapon for longer than most things have existed."]]}]},{"t":"Personality","p":[{"segs":[["Lanthys is ancient arrogance given form. He has been imprisoned long enough that his certainty of his own power has calcified into something beyond ego — it is simply his organizing principle. He does not negotiate from a position of equality. He never has. He speaks to those who enter his cell the way a collector speaks to something he has already decided to keep."]]}]},{"t":"Lore","p":[{"segs":[["One of the ancient beings imprisoned in the "],["Prison","the-prison"],[" long before the courts existed. A death-god — or something close enough to one that the distinction is largely academic. When "],["Nesta Archeron","nesta"],[" entered his cell he recognized immediately what she was and what she carried, asking her which death-god she was — acknowledging her "],["Cauldron","cauldron"],["-taken power as something that placed her in his category of being rather than below it. He attempted to claim her. He failed. His existence in the "],["Prison","the-prison"],[" is one of many indicators that what is locked away there is not merely criminal — some of it is cosmological."]]}]}],"back":[]},{"id":"mr-archeron","n":"Mr. Archeron","c":"characters","k":"mortal","f":1,"d":3,"sub":[["Mortal — Deceased"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["A man worn down by years of poverty and loss — once a wealthy merchant prince, reduced to someone who had forgotten what he used to be until the end gave him reason to remember."]]}]},{"t":"Personality","p":[{"segs":[["Quiet, passive, and defined for years by his own grief and failure. He loved his daughters in the helpless way of someone who did not know how to show it effectively. In the end he found something he had lost — not redemption exactly, but the courage he had set down a long time ago."]]}]},{"t":"Lore","p":[{"segs":[["Former merchant prince who lost his fortune, his ships, and his first wife to a storm off the coast of Bharat. Raised three daughters in poverty. His passivity shaped his daughters as much as anything else in their lives — each of them responded to it differently. In the final battle against "],["Hybern","king-of-hybern"],[" he captained a ship named The "],["Nesta","nesta"],[" into combat — his last act a deliberate choice to matter. Was killed by the King of "],["Hybern","king-of-hybern"],[" during that battle. "],["Feyre","feyre"],[" cremated his body. "],["Vassa","vassa"],[", who knew him during the war’s final days, considered him a father figure."]]}]}],"back":[]},{"id":"ataraxia","n":"Ataraxia","c":"relics","k":"night","f":5,"d":5,"sub":[["Sword — Forged by "],["Nesta Archeron","nesta"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["A long hunting sword of unmistakable presence. Its blade does not look entirely of this world — because it isn’t. It radiates something cold and final, the way the "],["Dread Trove","dread-trove"],[" does, because it was made from the same source."]]}]},{"t":"Notable","p":[{"segs":[["Forged by "],["Nesta","nesta"],[" using the "],["Cauldron","cauldron"],["-given power she took during her forced transformation — making it the only weapon in Prythian’s recent history created directly from that power by a mortal-made-Fae. It is capable of killing nearly anything, including beings that conventional weapons cannot touch. Its name means tranquility — a deliberate choice by the female who made it, who found her own version of peace in the act of forging it. It is not the "],["Truth-Teller","truth-teller"],[" and it is not "],["Gwydion","gwydion"],[" — but it belongs in the same conversation. A weapon made by someone who took power from the source of all creation and chose to shape it into something that protects rather than destroys."]]}]}],"back":[]},{"id":"ritas","n":"Rita’s","c":"places","k":"night","f":2,"d":2,"sub":[["Nightclub — "],["Velaris","velaris"],[", "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Rita’s sits in the heart of "],["Velaris","velaris"],[" and looks, from the outside, like exactly what it is — a place where the city comes to stop pretending to be responsible. Inside: low light, music that gets into the floor, and the particular energy of a room full of people who have collectively decided that tonight is not for thinking. The drinks are good. The dance floor is better."]]}]},{"t":"Lore","p":[{"segs":[["The Inner Circle’s preferred venue for the rare evenings when they are off-duty — which is to say, the evenings when "],["Rhysand","rhysand"],[" decides they are off-duty and "],["Cassian","cassian"],[" doesn’t argue. It is one of the few places in "],["Velaris","velaris"],[" where the High Lord of the "],["Night Court","night-court"],[" is simply a person at a table with a drink, and everyone in the room has the social intelligence to treat him accordingly. "],["Mor","morrigan"],[" is on a first-name basis with the staff. "],["Cassian","cassian"],[" has almost certainly been removed from the premises at least once. "],["Azriel","azriel"],[" has sat at the edge of the same booth watching the room for so many years that the seat is informally considered his. Whatever happens at Rita’s is not discussed at the "],["House of Wind","house-of-wind"],[" the following morning. This is an unspoken rule and everyone honors it."]]}]}],"back":[]},{"id":"madja","n":"Madja","c":"characters","k":"night","f":2,"d":5,"sub":[["Healer — "],["Night Court","night-court"],[", "],["Velaris","velaris"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Small and unhurried, with the particular stillness of someone who has seen enough that very little surprises her anymore. Silver-haired. Her hands are the most notable thing about her — steady, practiced, the hands of someone who has spent centuries doing precise work in difficult conditions."]]}]},{"t":"Personality","p":[{"segs":[["Madja does not perform competence. She simply has it, and she has no interest in explaining herself to anyone who doubts it. She speaks plainly, does not flinch from difficult truths, and has the rare quality of knowing exactly when to push and when to leave a patient to themselves. She is not warm in the conventional sense — she will not hold your hand or soften bad news for your comfort — but there is something deeply steadying about her presence. She is the person you want in the room when the situation is genuinely serious."]]}]},{"t":"Lore","p":[{"segs":[["The "],["Night Court","night-court"],["’s primary healer and the physician most trusted by "],["Rhysand","rhysand"],["’s Inner Circle for anything that requires real expertise. She has tended to "],["Illyrian","illyrians"],[" injuries, reproductive questions, and crises of the kind the Inner Circle prefers to keep entirely off record. She does not ask unnecessary questions and does not volunteer information about her patients to anyone. Her discretion is so absolute it functions as a kind of institutional memory — she has likely seen more of the Inner Circle’s most private moments than anyone else in "],["Velaris","velaris"],[" and has never once mentioned it."]]}]}],"back":[]}];
  }
  componentDidMount() { this._bindUnpin(); }
  _bindUnpin() {
    if (this._unpinBound || typeof document === 'undefined') return;
    this._unpinBound = true;
    document.addEventListener('click', (e) => {
      const st = this.state || {};
      if (!st.pin && !st.hover) return;
      const t = e.target;
      if (t && t.closest && t.closest('.map-stage')) return;
      this.setState({ pin: null, hover: null });
    });
  }
  componentDidUpdate() {
    this._bindUnpin();
    if (this._frameMap) {
      this._frameMap = false;
      try {
        if (window.innerWidth > 860) {
          const st = document.querySelector('.map-stage');
          if (st) {
            const r = st.getBoundingClientRect();
            if (r.top < -2 || r.bottom > window.innerHeight + 2) { this._hoverLock = Date.now() + 900; st.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
          }
        }
      } catch (e) {}
    }
    const t = this._scrollTo;
    if (!t) return;
    this._scrollTo = null;
    try {
      if (t === 'top') { window.scrollTo(0, 0); }

<script>
(function () {
  var ov = document.getElementById('evOverlay'), fr = document.getElementById('evFrame'), lastFocus = null, prevOverflow = '';
  function src(id) { return 'events/' + id + (window.innerWidth < 760 ? '-phone' : '') + '.html'; }
  function open(id) {
    lastFocus = document.activeElement;
    fr.src = src(id);
    prevOverflow = document.documentElement.style.overflow;
    document.documentElement.style.overflow = 'hidden';
    ov.classList.add('is-open');
    requestAnimationFrame(function () { ov.classList.add('is-shown'); try { fr.focus(); } catch (e) {} });
  }
  function close() {
    if (!ov.classList.contains('is-open')) return;
    ov.classList.remove('is-shown');
    setTimeout(function () { ov.classList.remove('is-open'); fr.src = 'about:blank'; }, 300);
    document.documentElement.style.overflow = prevOverflow;
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
  }
  window.openEventGuide = open;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.addEventListener('message', function (e) {
    if (e.data === 'eurielle-close-guide') close();
    else if (e.data && e.data.type === 'eurielle-open-entry') { close(); if (window.eurielleOpenEntry) window.eurielleOpenEntry(e.data.id); }
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-guide]');
    if (!a) return;
    e.preventDefault(); e.stopPropagation();
    open(a.getAttribute('data-guide'));
  }, true);
})();
