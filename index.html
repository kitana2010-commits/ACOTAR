<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prythian · An Interactive Lorebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Hanken+Grotesk:wght@300;400;500&amp;display=swap">
<style>html,body{margin:0;background:#04040C}
body{margin:0;background:#04040C}
a{color:#C9CEDC}a:hover{color:#FFFFFF}
input::placeholder{color:#7A8092}
.star{position:absolute;border-radius:50%;background:#EEF1FA;animation-name:twinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.star-still{position:absolute;border-radius:50%}
.panel-scroll{scrollbar-width:thin;scrollbar-color:rgba(170,158,240,.35) transparent}
.panel-scroll>*{flex-shrink:0}
@keyframes twinkle{0%,100%{opacity:var(--lo,.35)}50%{opacity:1}}
.shoot{position:absolute;width:180px;height:1px;background:linear-gradient(90deg,rgba(238,241,250,.9),rgba(238,241,250,0));opacity:0;animation:shoot 16s linear infinite}
@keyframes shoot{0%{opacity:0;transform:rotate(-22deg) translateX(0)}1.5%{opacity:.8}7%{opacity:0;transform:rotate(-22deg) translateX(-620px)}100%{opacity:0;transform:rotate(-22deg) translateX(-620px)}}
.nav-item{transition:color .25s ease}
.nav-item:hover{color:#F2F3F7}
.frame{transition:border-color .3s ease}
.frame:hover{border-color:rgba(214,219,235,0.38)}
.spot-line{transition:stroke .4s ease,stroke-opacity .4s ease}
.spot-star{transition:opacity .4s ease,box-shadow .4s ease}
.spot-label{transition:color .4s ease,letter-spacing .4s ease}
button:focus-visible,a:focus-visible,input:focus-visible{outline:1px solid #D6DBEB;outline-offset:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:scale(.95);opacity:.8}50%{transform:scale(1.05);opacity:1}}
@keyframes flick{0%,100%{opacity:.15}50%{opacity:1}}
.hero-photo{-webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.35) 18%,#000 46%,#000 86%,transparent 100%),linear-gradient(to bottom,#000 0,#000 64%,transparent 97%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.35) 18%,#000 46%,#000 86%,transparent 100%),linear-gradient(to bottom,#000 0,#000 64%,transparent 97%);mask-composite:intersect}
/* themed info box: each place dresses the map's info card in its own illustrated style */
.tcard{position:absolute;inset:0;z-index:0;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--bg);box-shadow:var(--glow);animation:tcIn .5s ease both}
@keyframes tcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tcard i{position:absolute;display:block;pointer-events:none}
.tc-top{left:0;right:0;top:0;background:var(--top) top center/100% auto no-repeat;aspect-ratio:var(--tr)}
.tc-bot{left:0;right:0;bottom:0;background:var(--bot) bottom center/100% auto no-repeat;aspect-ratio:var(--br)}
.tc-side{left:0;top:0;bottom:0;width:92px;background:var(--side) left top/100% 100% no-repeat}
.tc-sheen{inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.08) 45%,rgba(255,255,255,0) 60%)}
.themed .ps{z-index:1;padding:0 18px 0 var(--pl,24px) !important;top:var(--pt) !important;bottom:var(--pb) !important;scrollbar-color:var(--line) transparent}
.themed .ps h3,.themed .ps h4{color:var(--ink) !important}
.themed .ps p,.themed .ps dd,.themed .ps dd button,.themed .ps p button{color:var(--ink2) !important}
.themed .ps dt,.themed .ps .p-kind,.themed .ps > button{color:var(--ink3) !important}
.themed .ps .p-kind{letter-spacing:.34em !important}
.themed .ps .p-div{background:var(--acc) !important;width:96px !important;height:2px !important}
.themed .ps .p-img{border-color:var(--line) !important;background:var(--img) !important;color:var(--ink3) !important}
.themed .ps a{color:var(--ink) !important;border-color:var(--line) !important;background:var(--img)}
.themed .ps section > div,.themed .ps > div{border-color:var(--line) !important}
.themed .ps h3{text-shadow:0 1px 18px var(--img)}
.cfx{position:absolute;display:block;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite}
.cfx i{position:static !important;display:block;will-change:transform;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;background-position:center;background-size:contain;background-repeat:no-repeat}
.c-fall{animation-name:cFall}.c-rise{animation-name:cRise}.c-drift{animation-name:cDrift;animation-timing-function:ease-in-out;animation-direction:alternate}.c-tw{animation-name:fxTw;animation-timing-function:ease-in-out}
@keyframes cFall{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),1150px,0)}}
@keyframes cRise{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),-1150px,0)}}
@keyframes cDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),0,0)}}
@keyframes fxTw{0%,100%{opacity:.15}50%{opacity:1}}
.s-sway{animation-name:fxSway}.s-wob{animation-name:fxWob}.s-spin{animation-name:fxSpin;animation-direction:normal !important;animation-timing-function:linear !important}
@keyframes fxSway{from{transform:translateX(-22px) rotate(-35deg)}to{transform:translateX(22px) rotate(var(--rot))}}
@keyframes fxWob{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
.tc-preload{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:.01;pointer-events:none}
.tc-preload i{display:block;width:1px;height:1px}
.sp-maple0{background-image:url(assets/sp-maple0.webp)}
.sp-maple1{background-image:url(assets/sp-maple1.webp)}
.sp-maple2{background-image:url(assets/sp-maple2.webp)}
.sp-petal{background-image:url(assets/sp-petal.webp)}
.sp-leaf{background-image:url(assets/sp-leaf.webp)}
.sp-flake{background-image:url(assets/sp-flake.webp)}
.sp-bubble{background-image:url(assets/sp-bubble.webp)}

<div id="app"></div>
<template id="tpl-SpoilerDialog">
<div class="sd-wrap" style="position: relative; box-sizing: border-box; width: 100%; min-height: {{minH}}; height: {{h}}; display: flex; align-items: center; justify-content: center; padding: 32px 16px; overflow: auto; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; color: #E8E9EE; background: {{backdrop}}; backdrop-filter: {{bf}}; -webkit-backdrop-filter: {{bf}}">

  <sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
      <div style="position: absolute; left: -25%; top: 0%; width: 150%; height: 900px; transform: rotate(16deg); filter: blur(38px)">
        <span style="position: absolute; left: 0; right: 0; top: 22%; bottom: 22%; border-radius: 50%; background: radial-gradient(ellipse at 55% 50%, rgba(96, 62, 204, 0.30), rgba(46, 40, 150, 0.16) 40%, rgba(46, 40, 150, 0) 72%)"></span>
        <span style="position: absolute; left: 18%; right: 22%; top: 36%; bottom: 36%; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(236, 178, 214, 0.20), rgba(168, 128, 228, 0.12) 45%, rgba(168, 128, 228, 0) 72%)"></span>
        <span style="position: absolute; left: 2%; width: 42%; top: 32%; bottom: 32%; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(72, 150, 210, 0.16), rgba(72, 150, 210, 0) 70%)"></span>
        <span style="position: absolute; left: 12%; right: 10%; top: 47.5%; height: 5%; border-radius: 50%; background: rgba(3, 3, 12, 0.85)"></span>
      </div>
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
        <span style="position: absolute; left: {{s.x}}%; top: {{s.y}}%; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: {{s.c}}; opacity: {{s.o}}"></span>
      </sc-for>
    </div>
  </sc-if>

  <div class="sd-box" role="dialog" aria-modal="true" aria-labelledby="sd-title" aria-describedby="sd-note" style="position: relative; box-sizing: border-box; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 28px; padding: 48px 44px 36px; border-radius: 2px; background: #05040F; border: 1px solid rgba(170, 158, 240, 0.26); box-shadow: 0 50px 120px rgba(0, 0, 0, 0.8), 0 0 120px rgba(110, 86, 220, 0.14)">

    <sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{close}}" aria-label="Close" style="position: absolute; top: 14px; right: 14px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; background: transparent; color: #8D89AE; cursor: pointer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </sc-if>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
      <svg viewBox="0 0 40 40" width="28" height="28" fill="none" stroke="#D6DBEB" stroke-width="1" aria-hidden="true"><path d="M26 6a15 15 0 1 0 8 26A13 13 0 1 1 26 6z"></path></svg>
      <h2 id="sd-title" class="sd-title" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 300; line-height: 1.02; color: #F2F3F7">How far have you read?</h2>
      <p id="sd-note" style="margin: 0; max-width: 460px; font-size: 15px; line-height: 1.7; color: #A3A8B8">Choose the last book you’ve finished. Everything after that point is automatically veiled across the wiki. Veiled passages are blurred and marked, so you can uncover any of them with a tap whenever you choose.</p>
    </div>

    <div role="group" aria-label="Reading progress" style="display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{startRow}}" as="o" hint-placeholder-count="1">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 56px; padding: 10px 18px; box-sizing: border-box; border-radius: 2px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: #E8E9EE; text-align: left; font-family: 'Hanken Grotesk', sans-serif; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 400; color: {{o.titleColor}}">{{o.title}}</span>
            <span style="font-size: 13px; color: #8D89AE">{{o.sub}}</span>
          </span>
          <span aria-hidden="true" style="flex: none; width: 14px; height: 14px; box-sizing: border-box; transform: rotate(45deg); border: 1px solid {{o.ring}}; background: {{o.dot}}"></span>
        </button>
      </sc-for>

      <span style="margin-top: 8px; font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #7A76A0">Or the last book you’ve finished</span>
      <div class="sd-books" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px">
        <sc-for list="{{books}}" as="b" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{b.pressed}}" aria-label="{{b.title}}" onClick="{{b.pick}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 92px; padding: 10px 6px; box-sizing: border-box; border-radius: 2px; border: 1px solid {{b.border}}; background: {{b.bg}}; color: #E8E9EE; font-family: 'Hanken Grotesk', sans-serif; cursor: pointer">
            <span style="font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; color: {{b.numColor}}">{{b.roman}}</span>
            <span style="font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; letter-spacing: 0.04em; color: {{b.abbrColor}}">{{b.abbr}}</span>
            <span aria-hidden="true" style="width: {{b.barW}}; height: 1px; background: {{b.bar}}"></span>
          </button>
        </sc-for>
      </div>
      <p aria-live="polite" style="margin: 0; min-height: 24px; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; line-height: 1.4; color: {{captionColor}}; text-align: center">{{caption}}</p>

      <div aria-hidden="true" style="display: flex; align-items: center; gap: 16px; font-family: 'Cormorant Garamond', serif; font-size: 16px; font-style: italic; color: #7A76A0">
        <span style="flex: 1; height: 1px; background: rgba(170, 158, 240, 0.16)"></span>
        or
        <span style="flex: 1; height: 1px; background: rgba(170, 158, 240, 0.16)"></span>
      </div>

      <sc-for list="{{allRow}}" as="o" hint-placeholder-count="1">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 56px; padding: 10px 18px; box-sizing: border-box; border-radius: 2px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: #E8E9EE; text-align: left; font-family: 'Hanken Grotesk', sans-serif; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 400; color: {{o.titleColor}}">{{o.title}}</span>
            <span style="font-size: 13px; color: #8D89AE">{{o.sub}}</span>
          </span>
          <span aria-hidden="true" style="flex: none; width: 14px; height: 14px; box-sizing: border-box; transform: rotate(45deg); border: 1px solid {{o.ring}}; background: {{o.dot}}"></span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 22px; border-top: 1px solid rgba(170, 158, 240, 0.16)">
      <span style="font-size: 13px; color: #8D89AE">You can change this any time from the sidebar.</span>
      <sc-if value="{{showLink}}" hint-placeholder-val="{{ false }}">
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 24px; border-radius: 2px; background: #E8E9EE; color: #05050C; text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">
          Enter
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
        </a>
      </sc-if>
      <sc-if value="{{showDisabled}}" hint-placeholder-val="{{ true }}">
        <button type="button" disabled style="min-height: 50px; padding: 0 24px; border-radius: 2px; border: 1px solid rgba(214, 219, 235, 0.16); background: transparent; color: #7A76A0; font-family: 'Hanken Grotesk', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">Enter</button>
      </sc-if>
      <sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{confirm}}" style="min-height: 50px; padding: 0 28px; border-radius: 2px; border: 0; background: #E8E9EE; color: #05050C; font-family: 'Hanken Grotesk', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer">Save</button>
      </sc-if>
    </div>
  </div>
</div>
</template>

                  <span style="font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #D6DBEB">Tap to reveal anyway</span>
                </button>
              </sc-if>
              <button type="button" onClick="{{f.lore}}" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid rgba(170, 158, 240, 0.22); border-radius: 2px; background: transparent; color: #B4B1CC; font-family: 'Hanken Grotesk', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"></path><path d="M12 6v13.5"></path></svg>
                Lorebook entry
              </button>
            </div>
          </sc-for>
        </div>
      </section>
      </sc-if>

      <sc-if value="{{isLore}}" hint-placeholder-val="{{ false }}">
      <section id="lorebook" class="sec" aria-labelledby="lorebook-title" style="display: flex; flex-direction: column; gap: 28px; padding: 48px 0 72px">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <span style="font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #7A76A0">The Prythian Archive</span>
            <h2 id="lorebook-title" class="sec-h2 lore-h" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 64px; font-weight: 300; line-height: 1; color: #F2F3F7">The Lorebook</h2>
            <p style="margin: 0; font-size: 15px; color: #8D89AE">{{loreShown}} of {{loreTotal}} entries · veiled to <span style="font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; color: #E8E9EE">{{levelLabel}}</span></p>
          </div>
          <div style="flex: 0 1 380px; min-width: 0; display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(214, 219, 235, 0.28)">
            <label for="lore-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search the Lorebook</label>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8D89AE" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <input id="lore-search" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Search names, places, powers…" style="flex: 1; min-width: 0; min-height: 44px; background: transparent; border: 0; color: #F2F3F7; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; font-weight: 300">
            <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{clearQ}}" aria-label="Clear search" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; background: transparent; color: #B4B1CC; cursor: pointer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </sc-if>
          </div>
        </div>

        <div class="lore-tabs" role="group" aria-label="Categories" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{loreCats}}" as="c" hint-placeholder-count="7">
            <button type="button" onClick="{{c.go}}" aria-pressed="{{c.pressed}}" style="flex: none; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 16px; border: 1px solid {{c.border}}; border-radius: 2px; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; font-weight: 400; white-space: nowrap; cursor: pointer">
              {{c.label}}
              <span style="font-size: 11px; color: #7A76A0">{{c.count}}</span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px">
          <div class="lore-list" style="flex: 1 1 300px; min-width: 0; max-width: 400px; display: flex; flex-direction: column; gap: 18px">
            <sc-if value="{{loreEmpty}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-style: italic; color: #A3A8B8">Nothing in the archive matches “{{q}}”.</p>
            </sc-if>
            <sc-for list="{{loreGroups}}" as="g" hint-placeholder-count="0">
              <div style="display: flex; flex-direction: column">
                <span style="padding: 0 12px 8px; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-style: italic; color: #7A76A0; border-bottom: 1px solid rgba(170, 158, 240, 0.16)">{{g.label}}</span>
                <sc-for list="{{g.items}}" as="it" hint-placeholder-count="0">
                  <button type="button" onClick="{{it.open}}" aria-pressed="{{it.pressed}}" class="lore-item" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 62px; padding: 10px 12px; box-sizing: border-box; border: 0; border-bottom: 1px solid rgba(170, 158, 240, 0.10); background: {{it.bg}}; color: #E8E9EE; font-family: 'Hanken Grotesk', sans-serif; text-align: left; cursor: pointer">
                    <span aria-hidden="true" style="flex: none; width: 6px; height: 6px; transform: rotate(45deg); background: {{it.color}}"></span>
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                      <sc-if value="{{it.named}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.15; color: #F2F3F7">{{it.name}}</span></sc-if>
                      <sc-if value="{{it.veiledName}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Cormorant Garamond', serif; font-size: 19px; font-style: italic; color: #8D89AE">A veiled entry · {{it.tag}}</span></sc-if>
                      <span style="font-size: 12.5px; color: #8D89AE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span>
                    </span>
                    <span style="flex: none; font-size: 9px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #6E6A94">{{it.catLabel}}</span>
                  </button>
                </sc-for>
              </div>
            </sc-for>
          </div>

          <div id="lore-reader" class="lore-reader {{readerState}}" style="flex: 999 1 480px; min-width: 0; position: sticky; top: 24px; max-height: calc((100vh - 48px) / var(--z, 1)); overflow-y: auto; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgba(170, 158, 240, .35) transparent">
            <div class="reader-bar" style="position: sticky; top: 0; z-index: 2; align-items: center; justify-content: space-between; height: 60px; margin: 0 -16px 8px; padding: 0 8px; background: #04040C; border-bottom: 1px solid rgba(170, 158, 240, 0.16)">
              <button type="button" onClick="{{closeEntry}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 10px; border: 0; background: transparent; color: #F2F3F7; font-family: 'Hanken Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg>
                Lorebook
              </button>
            </div>


            <sc-if value="{{hasEntry}}" hint-placeholder-val="{{ false }}">
              <article aria-labelledby="entry-title" style="display: flex; flex-direction: column; gap: 26px; padding-bottom: 24px">
                <div style="display: flex; flex-direction: column; gap: 12px">
                  <span style="font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #8D89AE">{{reader.eyebrow}}</span>
                  <sc-if value="{{reader.named}}" hint-placeholder-val="{{ true }}">
                    <h3 id="entry-title" class="lore-name" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 56px; font-weight: 300; line-height: 1; color: #F2F3F7">{{reader.name}}</h3>
                  </sc-if>
                  <sc-if value="{{reader.veiledName}}" hint-placeholder-val="{{ false }}">
                    <h3 id="entry-title" class="lore-name" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 56px; font-weight: 300; font-style: italic; line-height: 1; color: #8D89AE">A veiled entry</h3>
                  </sc-if>
                  <sc-if value="{{reader.hasSub}}" hint-placeholder-val="{{ false }}">
                    <p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 21px; font-style: italic; line-height: 1.35; color: #B4B1CC"><sc-for list="{{reader.sub}}" as="g" hint-placeholder-count="0"><sc-if value="{{g.plain}}" hint-placeholder-val="{{ true }}">{{g.text}}</sc-if><sc-if value="{{g.link}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{g.open}}" style="display: inline; padding: 0; border: 0; border-bottom: 1px solid rgba(185, 174, 245, 0.45); background: transparent; color: #D9D3FF; font: inherit; cursor: pointer">{{g.text}}</button></sc-if></sc-for></p>
                  </sc-if>
                  <span aria-hidden="true" style="width: 72px; height: 1px; background: {{reader.color}}"></span>
                </div>

                <sc-if value="{{reader.noArt}}" hint-placeholder-val="{{ true }}">
                  <div style="aspect-ratio: {{reader.imgRatio}}; box-sizing: border-box; border: 1px solid rgba(170, 158, 240, 0.20); border-radius: 2px; background: radial-gradient(ellipse at 50% 120%, {{reader.color}}38, rgba(0, 0, 0, 0) 70%), #05050C; display: flex; align-items: center; justify-content: center; color: #7A8092; font-size: 13px; letter-spacing: 0.06em">{{reader.img}}</div>
                </sc-if>
                <sc-if value="{{reader.hasArt}}" hint-placeholder-val="{{ false }}">
                  <figure style="position: relative; margin: 0; aspect-ratio: {{reader.imgRatio}}; overflow: hidden; border: 1px solid rgba(170, 158, 240, 0.24); border-radius: 2px; background: #05050C">
                    <sc-if value="{{reader.fitWhole}}" hint-placeholder-val="{{ false }}"><img src="{{reader.artSrc}}" alt="" aria-hidden="true" style="position: absolute; inset: -24px; width: calc(100% + 48px); height: calc(100% + 48px); object-fit: cover; filter: blur(22px) brightness(0.45) saturate(1.1); display: block"></sc-if>
                    <img src="{{reader.artSrc}}" alt="{{reader.artAlt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: {{reader.artFit}}; object-position: {{reader.artPos}}; display: block">
                    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(0deg, rgba(4, 4, 12, 0.7), rgba(4, 4, 12, 0))"></span>
                  </figure>
                </sc-if>

                <sc-if value="{{reader.hasGuide}}" hint-placeholder-val="{{ false }}">
                  <a class="guide-btn" href="{{reader.guideHref}}" data-guide="{{reader.guideId}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border: 1px solid rgba(214, 219, 235, 0.45); border-radius: 2px; background: linear-gradient(135deg, rgba(110, 96, 200, 0.22), rgba(20, 18, 40, 0.6)); box-shadow: 0 0 30px rgba(150, 140, 255, 0.12); color: #F2F3F7; text-decoration: none">
                    <span style="display: flex; flex-direction: column; gap: 6px">
                      <span style="font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #B9AEF5">Traveler’s Guide</span>
                      <span style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-style: italic; line-height: 1.2">Step into the festival</span>
                    </span>
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
                  </a>
                </sc-if>
                <sc-if value="{{reader.gateName}}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{reader.reveal}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 22px 24px; border: 1px dashed rgba(185, 174, 245, 0.40); border-radius: 2px; background: rgba(124, 98, 228, 0.06); color: #B4B1CC; font-family: 'Hanken Grotesk', sans-serif; text-align: left; cursor: pointer">
                    <span style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-style: italic; color: #F2F3F7">This entry is veiled</span>
                    <span style="font-size: 14px; line-height: 1.6">It first appears in {{reader.gateBookFull}}, past where you’ve read. Even its name stays hidden.</span>
                    <span style="font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #D6DBEB">Tap to reveal anyway</span>
                  </button>
                </sc-if>
                <sc-if value="{{reader.gateBody}}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{reader.reveal}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 22px 24px; border: 1px dashed rgba(185, 174, 245, 0.40); border-radius: 2px; background: rgba(124, 98, 228, 0.06); color: #B4B1CC; font-family: 'Hanken Grotesk', sans-serif; text-align: left; cursor: pointer">
                    <span style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-style: italic; color: #F2F3F7">Veiled</span>
                    <span style="font-size: 14px; line-height: 1.6">This entry includes details from up to {{reader.gateBookFull}}.</span>
                    <span style="font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #D6DBEB">{{reader.gateBook}} · tap to reveal</span>
                  </button>
                </sc-if>

                <sc-if value="{{reader.showBody}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-direction: column; gap: 28px">
                    <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; padding: 18px 20px; border: 1px solid rgba(170, 158, 240, 0.16); border-radius: 2px; font-size: 14px">
                      <sc-for list="{{reader.rows}}" as="r" hint-placeholder-count="2">
                        <dt style="color: #8D89AE">{{r.l}}</dt>
                        <dd style="margin: 0; color: #E8E9EE; line-height: 1.55"><sc-for list="{{r.segs}}" as="g" hint-placeholder-count="0"><sc-if value="{{g.plain}}" hint-placeholder-val="{{ true }}">{{g.text}}</sc-if><sc-if value="{{g.link}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{g.open}}" style="display: inline; padding: 0; border: 0; border-bottom: 1px solid rgba(185, 174, 245, 0.45); background: transparent; color: #D9D3FF; font: inherit; cursor: pointer">{{g.text}}</button></sc-if></sc-for></dd>
                      </sc-for>
                    </dl>
                    <sc-for list="{{reader.sections}}" as="sec" hint-placeholder-count="0">
                      <section style="display: flex; flex-direction: column; gap: 12px">
                        <h4 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 400; line-height: 1.15; color: #F2F3F7">{{sec.t}}</h4>
                        <sc-for list="{{sec.paras}}" as="pa" hint-placeholder-count="0">
                          <p style="margin: 0; font-size: 15.5px; line-height: 1.85; color: #BEBBD6"><sc-if value="{{pa.hasLead}}" hint-placeholder-val="{{ false }}"><strong style="font-weight: 500; color: #F2F3F7">{{pa.lead}}</strong></sc-if><sc-for list="{{pa.segs}}" as="g" hint-placeholder-count="0"><sc-if value="{{g.plain}}" hint-placeholder-val="{{ true }}">{{g.text}}</sc-if><sc-if value="{{g.link}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{g.open}}" style="display: inline; padding: 0; border: 0; border-bottom: 1px solid rgba(185, 174, 245, 0.45); background: transparent; color: #D9D3FF; font: inherit; cursor: pointer">{{g.text}}</button></sc-if></sc-for></p>
                        </sc-for>
                      </section>
                    </sc-for>
                    <sc-if value="{{reader.hasMap}}" hint-placeholder-val="{{ false }}">
                      <a href="#map" onClick="{{reader.showOnMap}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 18px; border: 1px solid rgba(214, 219, 235, 0.30); border-radius: 2px; color: #F2F3F7; text-decoration: none; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></svg>
                        Show on the map
                      </a>
                    </sc-if>
                    <sc-if value="{{reader.hasBack}}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 1px solid rgba(170, 158, 240, 0.16)">
                        <span style="font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #7A76A0">Mentioned in</span>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px">
                          <sc-for list="{{reader.back}}" as="b" hint-placeholder-count="0">
                            <button type="button" onClick="{{b.open}}" style="display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 0 13px; border: 1px solid rgba(170, 158, 240, 0.22); border-radius: 2px; background: transparent; color: #D6DBEB; font-family: 'Cormorant Garamond', serif; font-size: 16px; cursor: pointer"><span aria-hidden="true" style="width: 5px; height: 5px; transform: rotate(45deg); background: {{b.color}}"></span>{{b.name}}</button>
                          </sc-for>
                        </div>
                      </div>
                    </sc-if>
                  </div>
                </sc-if>

                <div style="display: flex; justify-content: space-between; gap: 12px; padding-top: 18px; border-top: 1px solid rgba(170, 158, 240, 0.16)">
                  <sc-if value="{{reader.hasPrev}}" hint-placeholder-val="{{ false }}">
                    <button type="button" onClick="{{reader.prev}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 48px; padding: 6px 0; border: 0; background: transparent; color: #E8E9EE; text-align: left; cursor: pointer">
                      <span style="font-family: 'Hanken Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #7A76A0">← Previous</span>
                      <span style="font-family: 'Cormorant Garamond', serif; font-size: 19px">{{reader.prevName}}</span>
                    </button>
                  </sc-if>
                  <span></span>
                  <sc-if value="{{reader.hasNext}}" hint-placeholder-val="{{ false }}">
                    <button type="button" onClick="{{reader.next}}" style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-height: 48px; padding: 6px 0; border: 0; background: transparent; color: #E8E9EE; text-align: right; cursor: pointer">
                      <span style="font-family: 'Hanken Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #7A76A0">Next →</span>
                      <span style="font-family: 'Cormorant Garamond', serif; font-size: 19px">{{reader.nextName}}</span>
                    </button>
                  </sc-if>
                </div>
              </article>
            </sc-if>
          </div>
        </div>
      </section>
      </sc-if>

      <footer class="footer" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 28px 0 8px; border-top: 1px solid rgba(170, 158, 240, 0.16); font-size: 13px; color: #8D89AE">
        <span>Eurielle · A fan-made wiki. Not affiliated with the author or publisher.</span>
        <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 22px">
          <button type="button" onClick="{{openDialog}}" style="padding: 0; border: 0; background: transparent; color: #C9CEDC; font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; font-weight: 300; cursor: pointer">Spoiler settings</button>
        </span>
      </footer>
    </main>
  </div>

  <nav class="m-only" aria-label="Quick navigation" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; align-items: stretch; height: 68px; padding: 0 4px; box-sizing: border-box; background: rgba(4, 3, 14, 0.96); border-top: 1px solid rgba(170, 158, 240, 0.18)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" onClick="{{t.go}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-width: 0; text-decoration: none; color: {{t.fg}}; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        {{t.label}}
      </a>
    </sc-for>
    <button type="button" onClick="{{openMenu}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-width: 0; border: 0; background: transparent; color: #B4B1CC; font-family: 'Hanken Grotesk', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
      Menu
    </button>
  </nav>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Menu" style="position: fixed; inset: 0; z-index: 70; overflow-y: auto; background: #04040C; font-family: 'Hanken Grotesk', sans-serif">
      <div style="position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 8px 0 16px; background: #04040C; border-bottom: 1px solid rgba(170, 158, 240, 0.16)">
        <a href="https://kitana2010-commits.github.io/Character-Gallery/" style="font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #F2F3F7; text-decoration: none">Eurielle</a>
        <button type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 0; background: transparent; color: #F2F3F7; cursor: pointer">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 32px; padding: 24px 16px 40px">
        <nav aria-label="Explore" style="display: flex; flex-direction: column">
          <p style="margin: 0 0 6px; font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #7A76A0">Explore</p>
          <sc-for list="{{menuLinks}}" as="m" hint-placeholder-count="8">
            <sc-if value="{{m.special}}" hint-placeholder-val="{{ false }}">
            <a href="{{m.href}}" onClick="{{m.go}}" class="nav-fest" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 54px; margin: 10px 0; border: 1px solid rgba(214, 219, 235, 0.55); border-radius: 2px; background: linear-gradient(135deg, rgba(120, 104, 214, 0.30), rgba(18, 16, 40, 0.55)); text-decoration: none; color: #F2F3F7; font-family: 'Cormorant Garamond', serif; font-size: 22px">
              <span aria-hidden="true" style="font-size: 11px; color: #D6DBEB">✦</span>{{m.label}}<span aria-hidden="true" style="font-size: 11px; color: #D6DBEB">✦</span>
            </a>
            </sc-if>
            <sc-if value="{{m.plain}}" hint-placeholder-val="{{ true }}">
            <a href="{{m.href}}" onClick="{{m.go}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid rgba(170, 158, 240, 0.12); text-decoration: none; color: #E8E9EE; font-family: 'Cormorant Garamond', serif; font-size: 22px">
              {{m.label}}
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7A76A0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
            </a>
            </sc-if>
          </sc-for>
        </nav>
        <nav aria-label="The Courts" style="display: flex; flex-direction: column; gap: 10px">
          <p style="margin: 0; font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #7A76A0">The Courts</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{navCourtLinks}}" as="c" hint-placeholder-count="7">
              <a href="#lorebook" onClick="{{c.open}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border: 1px solid rgba(170, 158, 240, 0.18); border-radius: 2px; text-decoration: none; color: #E8E9EE; font-family: 'Cormorant Garamond', serif; font-size: 18px">
                <span aria-hidden="true" style="flex: none; width: 6px; height: 6px; transform: rotate(45deg); background: {{c.color}}"></span>
                {{c.short}}
              </a>
            </sc-for>
          </div>
        </nav>
        <nav aria-label="Beyond Prythian" style="display: flex; flex-direction: column; gap: 10px">
          <p style="margin: 0; font-size: 10px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #7A76A0">Beyond Prythian</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{navBeyondLinks}}" as="c" hint-placeholder-count="4">
              <a href="#lorebook" onClick="{{c.open}}" style="display: flex; align-items: center; min-height: 52px; padding: 0 14px; border: 1px solid rgba(170, 158, 240, 0.18); border-radius: 2px; text-decoration: none; color: #E8E9EE; font-family: 'Cormorant Garamond', serif; font-size: 18px">{{c.name}}</a>
            </sc-for>
          </div>
        </nav>

        </div>
      </div>
    </div>

  </sc-if>
</div>

ntered on the "],["Hewn City","hewn-city"],[" — is its public face: brutal, hierarchical, and politically vicious. The Court of Dreams — centered on "],["Velaris","velaris"],[" — is its hidden truth: a sanctuary built for artists, dreamers, and those who would otherwise have no place in Prythian. Most of Prythian believes only the former exists."]]}]},{"t":"Notable","p":[{"segs":[["Rhysand","rhysand"],[" deliberately maintains the Night Court’s reputation as the most feared court in Prythian. That fear is a shield. The Night Court commands the most powerful military force in Prythian, led by "],["Illyrian","illyrians"],[" warriors."]]}]}],"back":["azriel","cassian","hewn-city","illyrian-mountains","illyrians","madja","nyx","ritas","starfall","tarquin","the-prison","velaris","winter-solstice"]},{"id":"winter-court","n":"The Winter Court","c":"places","k":"winter","f":1,"d":3,"sub":[],"rows":[{"l":"High Lord","v":[["Kallias","kallias"]]}],"sec":[{"t":"Geography","p":[{"segs":[["Permanent winter. Snow, ice, frozen terrain. Borders the "],["Summer","summer-court"],[" and "],["Autumn","autumn-court"],[" Courts to the south."]]}]},{"t":"People","p":[{"segs":[["Kallias","kallias"],[" rules alongside his "],["mate","mating-bond"],[" "],["Viviane","viviane"],[", who held the court together during the fifty years "],["Kallias","kallias"],[" was trapped "],["Under the Mountain","under-the-mountain"],[". The court’s people endured "],["Amarantha","amarantha"],["’s reign with quiet resilience. Their loyalty to "],["Kallias","kallias"],[" and "],["Viviane","viviane"],[" runs deep."]]}]},{"t":"Notable","p":[{"segs":[["Kallias","kallias"],[" was among the High Lords whose power was stripped by "],["Amarantha","amarantha"],[". "],["Viviane","viviane"],[" — though not a High Lady by title — functioned as de facto ruler of the Winter Court during his absence and is widely respected for it. The Winter Court joined the alliance against "],["Hybern","king-of-hybern"],[", bringing its arm ed, composed, and difficult to read."]]}]},{"t":"Notable","p":[{"segs":[["Thesan","thesan"],[" commands the "],["peregryns","peregryns"],[" — winged soldiers who serve as his standing army and are among the most distinctive fighting forces in Prythian. He joined the alliance against "],["Hybern","king-of-hybern"],[" and brought his "],["peregryns","peregryns"],[" to the final battle. His lover is one of his "],["peregryn","peregryns"],[" captains."]]}]}],"back":["day-court","peregryns","thesan","under-the-mountain"]},{"id":"summer-court","n":"The Summer Court","c":"places","k":"summer","f":1,"d":2,"sub":[],"rows":[{"l":"High Lord","v":[["Tarquin","tarquin"]]}],"sec":[{"t":"Geography","p":[{"segs":[["Coastal. Black-rocked shores, salt wind, waters every shade of blue."]]}]},{"t":"People","p":[{"segs":[["Sun-browned, unhurried. Shaped by a sea that gives and takes equally. The most openly trusting court in Prythian — a quality that has been both exploited and rewarded."]]}]},{"t":"Notable","p":[{"segs":[["Entrusted with one half of the "],["Book of Breathings","book-of-breathings"],[" — an ancient text capable of neutralizing the "],["Cauldron","cauldron"],[". Cannot be stolen by force or magic; it must be surrendered willingly by its keeper. The Summer Court practices the decree of "],["blood rubies","blood-rubies"],[" — a death mark issued against those who betray the court’s trust. Recipients are hunted until the decree is rescinded or carried out."]]}]}],"back":["blood-rubies","book-of-breathings","tarquin","varian","winter-court"]},{"id":"spring-court","n":"The Spring Court","c":"places","k":"spring","f":1,"d":4,"sub":[],"rows":[{"l":"High Lord","v":[["Tamlin","tamlin"]]}],"sec":[{"t":"Geography","p":[{"segs":[["The southernmost court. The only court to border the "],["Wall","the-wall"],[" separating Prythian from the "],["Mortal Lands","mortal-lands"],["."]]}]},{"t":"People","p":[{"segs":[["Tamlin","tamlin"],["’s court reflects his rule — once prosperous and open, it fell into decay and isolation following "],["Amarantha","amarantha"],["’s curse and the events that came after. His people suffered for his failures of leadership."]]}]},{"t":"Notable","p":[{"segs":[["The Spring Court is the site of "],["Calanmai","calanmai"],[" — "],["Fire Night","calanmai"],[" — an ancient ritual marking the start of spring across Prythian. The High Lord becomes the Hunter, hunts the white stag, and performs the "],["Great Rite","calanmai"],[" in a sacred cave, releasing magic into the land itself. The court is known for its glamours and shapeshifting power. "],["Tamlin","tamlin"],["’s beast form is among the most formidable in Prythian. The Spring Court’s proximity to the "],["Wall","the-wall"],[" made it "],["Amarantha","amarantha"],["’s chosen showcase during her reign — kept functional while the rest of Prythian suffered."]]}]}],"back":["alis","calanmai","ianthe","lucien","mortal-lands","tamlin","the-wall"]},{"id":"day-court","n":"The Day Court","c":"places","k":"day","f":1,"d":3,"sub":[],"rows":[{"l":"High Lord","v":[["Helion Spell-Cleaver","helion"]]}],"sec":[{"t":"Geography","p":[{"segs":[["North of the "],["Dawn Court","dawn-court"],[". Said to be a land of perpetual light and warmth."]]}]},{"t":"People","p":[{"segs":[["Scholars, historians, keepers of knowledge. The Day Court houses more of Prythian’s history within its libraries than anywhere else in the land. "],["Helion","helion"],[" reflects his court — brilliant, hedonistic, and unconcerned with pretense."]]}]},{"t":"Notable","p":[{"segs":[["Helion","helion"],["’s power is light and spell-breaking — he is capable of unraveling almost any enchantment or ward, making him one of the most tactically valuable High Lords in Prythian. He joined the alliance against "],["Hybern","king-of-hybern"],[". His court’s vast libraries are considered the closest thing Prythian has to a central repository of historical record. "],["Helion","helion"],[" himself is as known for his appetites as his power — he makes no effort to hide either."]]}]}],"back":["beron","helion","lucien"]},{"id":"autumn-court","n":"The Autumn Court","c":"places","k":"autumn","f":1,"d":3,"sub":[],"rows":[{"l":"High Lord","v":[["Beron Vanserra"]]}],"sec":[{"t":"Geography","p":[{"segs":[["Endless forests locked in permanent autumn. Red, gold, and orange canopy. Cold air, the smell of woodsmoke and decay beneath the beauty."]]}]},{"t":"People","p":[{"segs":[["Proud, treacherous, and politically cunning. The Autumn Court is considered the most ruthless and scheming of the seasonal courts. Loyalty is transactional. Beron rules through fear and political maneuvering rather than respect."]]}]},{"t":"Notable","p":[{"segs":[["Beron is a High Lord of considerable fire power but greater political ambition. He is slow to commit to alliances and quick to calculate personal gain. The Vanserra sons — "],["Eris","eris"],[" and his emissary "],["Lucien","lucien"],[" — reflect the court’s internal fractures. "],["Lucien","lucien"],["’s estrangement from Beron and the Autumn Court is an open wound in their politics."]]}]}],"back":["beron","eris","helion","jesminda","lucien","winter-court"]},{"id":"illyrian-mountains","n":"The Illyrian Mountains","c":"places","k":"night","f":2,"d":5,"sub":[],"rows":[{"l":"High Lord","v":[["Rhysand","rhysand"]]}],"sec":[{"t":"Geography","p":[{"segs":[["Brutal, unforgiving mountain terrain in the far north of the "],["Night Court","night-court"],[". Home to scattered war camps, the most notable being Windhaven."]]}]},{"t":"People","p":[{"segs":[["The "],["Illyrians","illyrians"],[" are a warrior subspecies of Fae defined by large bat-like wings and a rigid war camp hierarchy. Their culture is deeply patriarchal — females are frequently clipped (their wings cut) to prevent flight and keep them subservient. "],["Illyrian","illyrians"],[" society values strength, combat, and bloodline above all else. They are considered "],["Lesser Fae","lesser-fae"],[" by the "],["Hewn City","hewn-city"],["’s nobility, a designation "],["Illyrians","illyrians"],[" themselves contest."]]}]},{"t":"Notable","p":[{"segs":[["Rhysand","rhysand"],[", "],["Cassian","cassian"],[", and "],["Azriel","azriel"],[" all trained at Windhaven, making it the origin point of the "],["Night Court","night-court"],["’s most powerful military figures. Ramiel is the most sacred peak in the Illyrian mountains — an ancient, black-rocked summit topped by an onyx monolith. Touching that monolith is the ultimate proof of "],["Illyrian","illyrians"],[" warriorhood. The "],["Rite","blood-rite"],[" — a brutal trials event held in the mountains — is the defining passage into full "],["Illyrian","illyrians"],[" warrior status."]]}]}],"back":["blood-rite","emerie","enalius","illyrians","night-court","valkyries","winter-solstice"]},{"id":"house-of-wind","n":"The House of Wind","c":"places","k":"night","f":2,"d":5,"sub":[],"rows":[],"sec":[{"t":"Geography","p":[{"segs":[["Carved into the cliffs high above "],["Velaris","velaris"],[". Accessible only by flight or winnowing — no stairs connect it to the city below."]]}]},{"t":"People","p":[{"segs":[["Functions as the primary residence and base of operations for "],["Rhysand","rhysand"],["’s Inner Circle. More fortress than home, though it has been both."]]}]},{"t":"Notable","p":[{"segs":[["The House of Wind is sentient and responsive — but only to those it has accepted. For those it welcomes, it perceives needs and desires and acts on them directly: manifesting requested items, adjusting its environment, making its preferences known. It is not merely warded stone; it has will. For those it has not accepted, it is simply a fortress. The House contains a vast multi-leveled "],["library","the-library"],[" carved deep into the rock beneath it, staffed entirely by female scholars called priestesses who have taken sanctuary there. The "],["library","the-library"],[" exists outside court politics; its inhabitants answer to no High Lord. The House later became the training ground where the "],["Valkyries","valkyries"],[" were reestablished, led by "],["Nesta Archeron","nesta"],[", "],["Cassian","cassian"],[", and "],["Gwyn","gwyn"],["."]]}]}],"back":["bryaxis","clotho","ritas","the-library","valkyries"]},{"id":"mortal-lands","n":"The Mortal Lands","c":"places","k":"mortal","f":1,"d":2,"sub":[],"rows":[{"l":"Ruler","v":[["Six "],["Mortal Queens","mortal-queens"],[", who rule from a palace on the Continent"]]}],"sec":[{"t":"Geography","p":[{"segs":[["Separated from Prythian by the "],["Wall","the-wall"],[" — an enormous invisible barrier erected following the War five hundred years ago. The "],["Wall","the-wall"],[" runs along the southern border of the "],["Spring Court","spring-court"],[". Human villages sit as close as two days’ travel from it."]]}]},{"t":"People","p":[{"segs":[["Mortal. Short-lived, largely powerless against Fae. Many fear what lies beyond the "],["Wall","the-wall"],["; few understand it. Human knowledge of Prythian and its courts is limited to legend and rumor — deliberately so."]]}]},{"t":"Notable","p":[{"segs":[["The Mortal Lands exist as a direct result of the Treaty signed at the end of the War between humans and Fae. The Treaty abolished human enslavement and mandated separation of the two peoples by the "],["Wall","the-wall"],[". Under its terms, any Fae crossing into the Mortal Lands forfeits their right to protection — humans may dispose of them however they choose. The six "],["Mortal Queens","mortal-queens"],[" hold one half of the "],["Book of Breathings","book-of-breathings"],[", surrendered to them as part of the post-War order. They rule from a palace on the Continent and can only surrender their half willingly — it cannot be taken by force or magic."]]}]}],"back":["bone-carver","calanmai","cauldron","cretea","drakon-miryam","graysen","jurian","king-of-hybern","mortal-queens","spring-court","the-wall","vassa"]},{"id":"dread-trove","n":"The Dread Trove","c":"relics","k":null,"f":5,"d":5,"sub":[["Three objects forged from the "],["Cauldron","cauldron"],[" itself"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["Three objects of immense power created from the "],["Cauldron","cauldron"],[". They can only be fully wielded by one who has taken power directly from the "],["Cauldron","cauldron"],[" itself."]]}]},{"t":"The three objects","p":[{"lead":"The Mask","segs":[["A bone-white mask capable of raising and commanding the dead. Those resurrected by it retain no will of their own — they serve the wearer absolutely. Its power is considered among the most dangerous in Prythian."]]},{"lead":"The Harp","segs":[["An ancient harp capable of opening doors between worlds and between planes of existence. It can manipulate space, time, and reality in ways that go beyond simple winnowing."]]},{"lead":"The Crown","segs":[["Capable of bending and breaking the will of anyone it is used against. It does not merely influence — it overwrites. Considered the most insidious of the three objects."]]}]},{"t":"Notable","p":[{"segs":[["Each object of the Trove carries a cost to its wielder. They are not tools — they are temptations. Only one who has taken power directly from the "],["Cauldron","cauldron"],[" can wield them without being consumed. In the wrong hands, any one of the three could destabilize the courts entirely."]]}]}],"back":["ataraxia","cauldron","nesta"]},{"id":"book-of-breathings","n":"The Book of Breathings","c":"relics","k":null,"f":2,"d":3,"sub":[["Sacred text — split into two halves"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["An ancient text written in Leshon Hakodesh — a sacred language — designed specifically to neutralize the "],["Cauldron","cauldron"],[". It is the only known counter to the "],["Cauldron","cauldron"],["’s power."]]}]},{"t":"Notable","p":[{"segs":[["To prevent misuse, the Book was divided into two halves and entrusted to separate keepers. One half was given to the High Lord of the "],["Summer Court","summer-court"],[". The other was given to the "],["Mortal Queens","mortal-queens"],[". Neither half can be stolen by force or magic — both must be surrendered willingly by their keeper, or the magic within is destroyed. The two halves are sentient to a degree — they resist, test, and react to those who handle them. When reunited, the Book becomes capable of binding or neutralizing the "],["Cauldron","cauldron"],[" entirely. It was used in the war against "],["Hybern","king-of-hybern"],[" to attempt to stop the "],["Cauldron","cauldron"],["’s destruction of the "],["Wall","the-wall"],["."]]}]}],"back":["cauldron","mortal-lands","mortal-queens","summer-court","tarquin"]},{"id":"under-the-mountain","n":"Under the Mountain","c":"places","k":null,"f":1,"d":1,"sub":[],"rows":[{"l":"Ruler","v":[["Formerly "],["Amarantha","amarantha"],[". Currently unclaimed"]]}],"sec":[{"t":"Geography","p":[{"segs":[["A vast subterranean palace carved from pale rock beneath a mountain on the border of the "],["Dawn","dawn-court"],[" and "],["Winter","winter-court"],[" Courts. Upheld by countless carved pillars depicting the history of Prythian. Two ancient stone doors — taller than any manor — mark its entrance. Chandeliers of jewels hang between the pillars, staining the red marble floors with color."]]}]},{"t":"People","p":[{"segs":[["During "],["Amarantha","amarantha"],["’s fifty-year reign, the courts of Prythian were forced to relocate here. It functioned as a prison disguised as a court — every High Lord and their people contained, controlled, and diminished beneath her rule."]]}]},{"t":"Notable","p":[{"segs":[["Under the Mountain was "],["Amarantha","amarantha"],["’s seat of power during her occupation of Prythian. It is where she stripped the High Lords of their powers, kept "],["Rhysand","rhysand"],[" as her personal slave, and held the courts captive for fifty years. It is where "],["Feyre","feyre"],[" completed the three trials, was killed, and was subsequently resurrected as High Fae by the seven High Lords. It is a place of profound trauma in Prythian’s recent history."]]}]}],"back":["amarantha","attor","feyre","kallias","rhysand","tamlin","viviane","winter-court"]},{"id":"weavers-cottage","n":"The Weaver’s Cottage","c":"places","k":null,"f":2,"d":5,"sub":[],"rows":[{"l":"Ruler","v":[["The Weaver — also called the Stryga. An ancient, blind creature of immense power who predates the courts"]]}],"sec":[{"t":"Geography","p":[{"segs":[["Located deep within the Wood at the heart of The Middle. Surrounded by her weaving — threads and tapestries that cover every surface and stretch into the trees around it."]]}]},{"t":"Notable","p":[{"segs":[["The Weaver is blind but perceives intruders through sound and scent. She is not a creature to "],["bargain","bargains"],[" with, reason with, or outrun easily. Her cottage is a trap as much as a home — visitors rarely leave. The Weaver herself is ancient beyond reckoning, connected to the Trove and to powers that predate Prythian’s courts."]]}]}],"back":["koschei","ouroboros"]},{"id":"cauldron","n":"The Cauldron","c":"relics","k":null,"f":1,"d":5,"sub":[["Object of primordial power — origin unknown"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["The source of all life in the world. According to Fae belief, every living thing was first poured into existence from its depths. It is not merely powerful — it is the foundation upon which the world itself was built."]]}]},{"t":"Appearance","p":[{"segs":[["A large black iron cauldron of immense weight. It radiates power that can be felt before it is seen."]]}]},{"t":"Notable","p":[{"segs":[["The Cauldron was weaponized by the "],["Daglan","daglan"],[" — ancient near-godlike beings who ruled before the Fae — who tied it to the soul of the world itself, effectively making it a kill switch capable of mutual destruction if tampered with incorrectly. It was later used to forge the "],["Dread Trove","dread-trove"],[". In the events of the War against "],["Hybern","king-of-hybern"],[", the King of "],["Hybern","king-of-hybern"],[" used the Cauldron to destroy the "],["Wall","the-wall"],[" and to forcibly transform "],["humans","mortal-lands"],[" into High Fae against their will — an act considered a profound violation, as the Cauldron’s power over life and death is absolute. It cannot be destroyed without destroying the world. It can be neutralized only by the "],["Book of Breathings","book-of-breathings"],["."]]}]}],"back":["ataraxia","azriel","book-of-breathings","daglan","drakon-miryam","dread-trove","elain","fionn","gwydion","jurian","king-of-hybern","lanthys","nesta","summer-court","the-wall","theia","truth-teller"]},{"id":"the-library","n":"The Library","c":"places","k":"night","f":2,"d":2,"sub":[],"rows":[{"l":"Ruler","v":[["No High Lord holds authority here. The Library governs itself"]]}],"sec":[{"t":"Geography","p":[{"segs":[["A vast multi-leveled structure carved deep into the rock beneath the "],["House of Wind","house-of-wind"],[". It descends in levels — the deeper the level, the more dangerous its inhabitants and contents."]]}]},{"t":"People","p":[{"segs":[["Staffed entirely by priestesses — female scholars who have taken sanctuary within its walls, many fleeing violence or trauma. The Library offers permanent refuge; once accepted, a priestess answers to no court and no High Lord. They are scholars, archivists, and guardians of knowledge in equal measure."]]}]},{"t":"Notable","p":[{"segs":[["The Library’s lowest levels house things that have no name and no court — including "],["Bryaxis","bryaxis"],[", a being of pure fear and darkness that was imprisoned there."]]}]}],"back":["bryaxis","clotho","gwyn","house-of-wind","valkyries","velaris"]},{"id":"truth-teller","n":"Truth-Teller","c":"relics","k":"night","f":2,"d":6,"sub":[["Dagger — forged from the "],["Cauldron","cauldron"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["One of two weapons forged from the "],["Cauldron","cauldron"],[" to defeat the "],["Daglan","daglan"],[". A black-bladed dagger, dark as night, that has never once failed to find its mark."]]}]},{"t":"Notable","p":[{"segs":[["The Truth-Teller has been in "],["Azriel","azriel"],["’s possession for as long as anyone can remember. Its origins as a "],["Cauldron","cauldron"],["-forged weapon make it far older than it appears — it predates the courts, predates the War, predates nearly everything in Prythian’s current political order. It is paired in history with "],["Gwydion","gwydion"],[", the sword wielded by "],["Fionn","fionn"],[". Together the two weapons were the instruments that ended "],["Daglan","daglan"],[" rule. Unlike "],["Gwydion","gwydion"],[", the Truth-Teller has never been lost. Whether it remains with "],["Azriel","azriel"],[" by chance or by something older than chance is unknown."]]}]}],"back":["ataraxia","azriel","daglan","gwydion","theia"]},{"id":"the-prison","n":"The Prison","c":"places","k":"night","f":2,"d":2,"sub":[],"rows":[{"l":"High Lord","v":[["No court claims it. The Prison predates the courts themselves"]]}],"sec":[{"t":"Geography","p":[{"segs":[["A desolate island carved into a single mountain. Nothing grows there. The entrance sits atop a sloped hill. The wards within are older than Prythian — magic does not function inside its walls."]]}]},{"t":"People","p":[{"segs":[["The Prison houses criminals and creatures who walked the earth before the Fae did. It is not a place of rehabilitation. Those entombed here were put here because nowhere else could hold them."]]}]},{"t":"Notable","p":[{"segs":[["The Prison is one of "],["Azriel","azriel"],["’s primary responsibilities as "],["Rhysand","rhysand"],["’s "],["spymaster","azriel"],[" — he is the "],["Night Court","night-court"],["’s appointed liaison and escort to the Prison, a role that requires navigating its wards without his magic. "],["Azriel","azriel"],[" despises the Prison. The absence of his power within its walls strips away the shadows that define him, leaving him exposed in a way few things can achieve. Among its notable inhabitants was the "],["Bone Carver","bone-carver"],[" — an ancient being capable of seeing truth and bargaining information, who appeared differently to every visitor."]]}]}],"back":["azriel","bone-carver","daglan","lanthys","middengard-wyrm"]},{"id":"attor","n":"The Attor","c":"creatures","k":null,"f":1,"d":2,"sub":[["Creature — Formerly "],["Amarantha","amarantha"],["’s service, then "],["Hybern","king-of-hybern"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A winged, predatory creature that functions as a soldier and spy. The Attor is not a singular being — multiple Attors exist, though they operate with a hive-like loyalty to whoever commands them."]]}]},{"t":"Appearance","p":[{"segs":[["Tall and spindly with gray, leathery skin. Bat-like wings. A long, pointed face with rows of needle-like teeth. Built for speed and terror rather than brute strength."]]}]},{"t":"Notable","p":[{"segs":[["The Attor served "],["Amarantha","amarantha"],[" during her fifty-year reign "],["Under the Mountain","under-the-mountain"],[", functioning as enforcer, torturer, and spy. After "],["Amarantha","amarantha"],["’s fall, the Attor transferred its allegiance to the King of "],["Hybern","king-of-hybern"],[". It is not a creature of independent will or ambition — it serves power, and it serves it without mercy. The Attor is sadistic by nature, taking evident pleasure in cruelty. It is fast, difficult to pin down, and dangerous in close quarters. It should not be mistaken for a mindless beast — it is cunning, observant, and capable of following complex orders."]]}]}],"back":[]},{"id":"blood-rubies","n":"Blood Rubies","c":"customs","k":"summer","f":2,"d":2,"sub":[["Death decree — "],["Summer Court","summer-court"],[", Prythian"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A formal decree of death unique to the "],["Summer Court","summer-court"],[". When issued, small blood-red rubies are sent to the named individuals — a declaration that they are marked for death by the "],["Summer Court","summer-court"],[" and will be hunted until the decree is carried out or rescinded."]]}]},{"t":"Notable","p":[{"segs":[["Blood rubies cannot be ignored or outwaited. They represent the full weight of the "],["Summer Court","summer-court"],["’s intent — issued only in response to profound betrayal of the court’s trust. The decree carries no expiration. It follows its recipients across court borders. Rescinding blood rubies is an act of significant political consequence, as it requires the issuing High Lord to publicly withdraw a death mark — an admission that something has changed. It is not done lightly."]]}]}],"back":["summer-court","tarquin"]},{"id":"middengard-wyrm","n":"The Middengard Wyrm","c":"creatures","k":null,"f":1,"d":1,"sub":[["Creature — The "],["Prison","the-prison"],[", Prythian"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A colossal subterranean predator. Not intelligent in any meaningful sense — it is appetite given form. One of the most physically dangerous creatures in Prythian."]]}]},{"t":"Appearance","p":[{"segs":[["Enormous. Worm-like in shape but scaled, with a body wide enough to swallow multiple people whole. It moves through tunnels of its own making, sensing vibration rather than relying on sight. Its mouth is ringed with teeth designed for one purpose."]]}]},{"t":"Notable","p":[{"segs":[["The Middengard Wyrm was imprisoned on the "],["Prison","the-prison"],[" island — contained not because it posed a political threat but because it posed a physical one to everything around it. It cannot be reasoned with, bargained with, or intimidated. It responds to movement and vibration, making stillness the only reliable defense — a defense that is nearly impossible to maintain when facing something of its size. It was used as a trial by those seeking to prove themselves capable of navigating the "],["Prison","the-prison"],[". Killing one requires either overwhelming power, extraordinary strategy, or both."]]}]}],"back":["bogge"]},{"id":"naga","n":"The Naga","c":"creatures","k":null,"f":1,"d":3,"sub":[["Creature — Prythian, various locations"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["Predatory humanoid creatures that hunt in packs. They are not mindless — they communicate, coordinate, and pursue with intent. They are not allied to any court and answer to no High Lord under ordinary circumstances, though they can be commanded by those with sufficient power."]]}]},{"t":"Appearance","p":[{"segs":[["Humanoid in shape but distinctly not Fae. Dark, scaled skin. Emaciated frames that move with unnatural speed. Their faces are elongated, their teeth sharp, their eyes without warmth or recognition."]]}]},{"t":"Notable","p":[{"segs":[["Naga are encountered in the wild territories between courts — the spaces where court law does not reach and nothing is protected. They hunt anything that crosses their territory. They were among the creatures used by "],["Amarantha","amarantha"],[" and later "],["Hybern","king-of-hybern"],[" as foot soldiers — their pack mentality and predatory instincts making them effective weapons when pointed in a direction. Encountering a single Naga is dangerous. Encountering a pack without significant magical ability or combat training is considered a death sentence."]]}]}],"back":["bogge"]},{"id":"suriel","n":"The Suriel","c":"creatures","k":null,"f":1,"d":1,"sub":[["Ancient creature — Prythian"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["An ancient oracle creature, skeletal in form and wrapped in tattered robes. It is not a predator — but it is not safe. It tells the truth when caught, and its truths are rarely comfortable."]]}]},{"t":"Appearance","p":[{"segs":[["Tall, gaunt, bones visible beneath its robes. Its voice is described as dry and rasping — something that has not needed to speak often and does not particularly enjoy it."]]}]},{"t":"Notable","p":[{"segs":[["The Suriel can be caught by luring it with food near a stream — it has known weaknesses despite its age and power. Once caught, it will answer questions honestly. It cannot lie. It will, however, answer only what is asked — it does not volunteer information freely. It can be bargained with and released in exchange for its honesty. The Suriel is not bound to any court and answers to nothing in Prythian’s political structure. It has existed long enough to know things that have been forgotten by everyone else. Approaching one carelessly — or failing to hold it — is considered suicidal."]]}]}],"back":["bargains"]},{"id":"bogge","n":"The Bogge","c":"creatures","k":null,"f":1,"d":1,"sub":[["Creature — Prythian, wild territories"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A shapeshifting predatory creature that hunts by mimicking what its prey most wants to see. It is not powerful in a magical sense — its danger lies entirely in deception."]]}]},{"t":"Appearance","p":[{"segs":[["Its true form is indistinct — dark, low to the ground, and wrong in a way that is difficult to articulate. It does not stay in its true form long enough to be studied."]]}]},{"t":"Notable","p":[{"segs":[["The Bogge lures prey by taking the shape of something desired or familiar — a person, a place, a feeling of safety. It cannot be fought by looking directly at it; engaging with its illusion feeds it. The only reliable defense against a Bogge is to refuse to look at it entirely — to deny it the attention it needs to function. It is not a creature of the courts and answers to nothing. It inhabits the wild spaces between territories where court law does not reach. It is considered a lesser threat than creatures like the "],["Naga","naga"],[" or the "],["Wyrm","middengard-wyrm"],[" — but underestimating it has killed more than one traveler who should have known better."]]}]}],"back":[]},{"id":"mating-bond","n":"The Mating Bond","c":"customs","k":null,"f":2,"d":2,"sub":[["Phenomenon — Prythian and broader Fae world"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A rare and permanent bond between two Fae who are considered equals in every sense — matched in power, soul, and will. It is not chosen. It is recognized."]]}]},{"t":"Notable","p":[{"segs":[["The mating bond manifests as a sudden and unmistakable awareness — described as a snap into place. Once recognized by both parties it creates a deep and permanent psychic and emotional connection. A mated pair shares a tether that transcends distance, court borders, and in some cases death. Finding a mate is exceptionally rare — most Fae live their entire lives without one and choose partners through love and choice instead. A mating bond does not override free will; it can be refused or ignored, though doing so carries significant emotional cost. It is considered by Fae society to be the most profound connection two beings can share — deeper than marriage, deeper than allegiance, deeper than court loyalty. Attempting to harm a Fae’s mate is widely understood to be the fastest way to provoke an otherwise controlled Fae into something feral and without limit."]]}]}],"back":["kallias","viviane","winter-court"]},{"id":"the-wall","n":"The Wall","c":"places","k":"mortal","f":1,"d":3,"sub":[["Barrier — Southern border of Prythian"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["An enormous invisible barrier separating Prythian from the "],["Mortal Lands","mortal-lands"],[". Erected five hundred years ago as a condition of the Treaty ending the War between "],["humans","mortal-lands"],[" and Fae."]]}]},{"t":"Geography","p":[{"segs":[["Runs along the southern border of the "],["Spring Court","spring-court"],[". The nearest "],["human","mortal-lands"],[" settlements sit approximately two days’ travel from it."]]}]},{"t":"Notable","p":[{"segs":[["The Wall was not merely a physical boundary — it was a magical one, preventing Fae from crossing into "],["Mortal Lands","mortal-lands"],[" without consequence. Under the terms of the Treaty, any Fae who crossed forfeited their right to protection; "],["humans","mortal-lands"],[" could dispose of them however they chose. The Wall also prevented most "],["humans","mortal-lands"],[" from perceiving or accessing Prythian. It was destroyed by the King of "],["Hybern","king-of-hybern"],[" using the "],["Cauldron","cauldron"],[" — an act that effectively nullified the Treaty and opened the border between the two worlds for the first time in five centuries. Its destruction was considered an act of war against both "],["humans","mortal-lands"],[" and the courts of Prythian that had honored the Treaty."]]}]}],"back":["book-of-breathings","cauldron","king-of-hybern","mortal-lands","mortal-queens","spring-court"]},{"id":"bryaxis","n":"Bryaxis","c":"creatures","k":"night","f":2,"d":5,"sub":[["Ancient being — The "],["Library","the-library"],[", "],["House of Wind","house-of-wind"],[", "],["Velaris","velaris"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A being of pure fear and darkness. Not a creature in any conventional sense — Bryaxis is what lives in the space between nightmares and reality. Her true form, if she has one, has never been confirmed."]]}]},{"t":"Appearance","p":[{"segs":[["Darkness given will. She manifests differently depending on who faces her — drawing on the deepest fears of those in her presence to take shape."]]}]},{"t":"Notable","p":[{"segs":[["Bryaxis was imprisoned in the deepest levels of the "],["Library","the-library"],[" beneath the "],["House of Wind","house-of-wind"],[" — contained not by physical walls but by wards older than the courts. She is considered one of the most dangerous beings in Prythian, not because of raw power alone but because fear itself is her weapon and her nature. She cannot be fought in any conventional sense — those who face her face their own terror made real. She can be bargained with, though doing so requires either extraordinary courage or extraordinary recklessness. She is not bound to any court and acknowledges no authority in Prythian."]]}]}],"back":["bargains","the-library"]},{"id":"bone-carver","n":"The Bone Carver","c":"creatures","k":null,"f":2,"d":2,"sub":[["Ancient being — The "],["Prison","the-prison"],[", Prythian"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["An ancient being of immense and unknowable power, imprisoned in the "],["Prison","the-prison"],[" long before the courts existed. Not Fae. Not "],["human","mortal-lands"],[". Something older than both."]]}]},{"t":"Appearance","p":[{"segs":[["The Bone Carver appeared differently to every person who encountered him. He showed each visitor what they most feared — or most needed to see. His true form was never confirmed."]]}]},{"t":"Notable","p":[{"segs":[["The Bone Carver resided in the "],["Prison","the-prison"],[" and could be bargained with for information — one of the few imprisoned beings willing to engage with visitors at all. He carved bones into objects of power, hence his name. His knowledge was vast and ancient, predating Prythian’s courts entirely. He could not be compelled or threatened — only bargained with on his own terms."]]}]}],"back":["bargains","koschei","the-prison"]},{"id":"blood-rite","n":"The Illyrian Blood Rite","c":"events","k":"night","f":2,"d":5,"sub":[],"rows":[{"l":"When","v":[["Each year in early spring. Hundreds of novice warriors enter simultaneously."]]}],"sec":[{"t":"Nature","p":[{"segs":[["The most sacred rite in "],["Illyrian","illyrians"],[" culture. A novice-warrior completes the Blood Rite to earn the status of true warrior. It is done in honor of "],["Enalius","enalius"],[" — the first and greatest "],["Illyrian","illyrians"],[" warrior, who held the Pass of "],["Ramiel","illyrian-mountains"],[" alone against enemy hordes for three days, climbing to the sacred monolith at the summit with his guts hanging out before dying there. The Pass now bears his name."]]}]},{"t":"Rules","p":[{"segs":[["Novices enter the conifer forests and ravines surrounding "],["Ramiel","illyrian-mountains"],[" with wings bound, no w
