eapons, no magic, and no Siphons. Only the clothes on their back. Novices from the same camp are separated at the start. They have one week to reach "],["Ramiel","illyrian-mountains"],[", scale it by hand, and touch the onyx monolith at the summit."]]}]},{"t":"Notable","p":[{"segs":[["Novices kill each other for food, clothing, vengeance, and glory. Old feuds are settled. New ones are born. The Rite functions as a controlled release for the dangerous tension within "],["Illyrian","illyrians"],[" society — better settled in the "],["mountains","illyrian-mountains"],[" than in civil war. Only fifteen warriors in history have reached "],["Ramiel","illyrian-mountains"],["’s summit. Only three have touched the monolith — two of whom died in the War against "],["Hybern","king-of-hybern"],[". No one knows who placed the onyx monolith at the top. "],["Devlon","devlon"],[", lord of "],["Windhaven","illyrian-mountains"],[", permitted "],["Rhysand","rhysand"],[", "],["Cassian","cassian"],[", and "],["Azriel","azriel"],[" to enter the Rite despite their status as crossbreed and bastards respectively — a politically significant decision that was not made lightly. The three completed it together."]]}]}],"back":["cassian","devlon","emerie","enalius","gwyn","illyrian-mountains","valkyries"]},{"id":"rhysand","n":"Rhysand","c":"characters","k":"night","f":1,"d":2,"sub":[["High Lord of the "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Tall, powerfully built. Dark hair, violet eyes that shift depending on his mood and the use of his power. His most distinctive feature is the tattoo — "],["Illyrian","illyrians"],[" markings that cover his hands and neck, the same markings shared by his Inner Circle as a symbol of their bond."]]}]},{"t":"Personality","p":[{"segs":[["Rhysand is charismatic and razor-witted, speaking in smooth, teasing tones that mask sharp intelligence. He rules with a dual persona — terrifying cunning to his enemies, profound loyalty and compassion to those he calls his own. His confidence is effortless, every move calculated. Fiercely protective, he guards those he loves with quiet devotion — playful banter, a soft darling, and steady wordless support are his native language. To threats, he is something else entirely: his starlit darkness turns cold and precise, capable of dismantling enemies without hesitation. Manipulative when needed, unpredictable in his justice. He guards his heart behind layers of trauma and guilt — but when he lets someone in, the connection is absolute. Tender, empowering, and unwavering."]]}]},{"t":"Lore","p":[{"segs":[["Half-"],["Illyrian","illyrians"],[", half-High Fae. The most powerful Daemati in Prythian — capable of entering and shattering minds. Spent fifty years as "],["Amarantha","amarantha"],["’s slave "],["Under the Mountain","under-the-mountain"],[" to protect "],["Velaris","velaris"],[". Was instrumental in "],["Feyre","feyre"],["’s survival of the three trials. Resurrected "],["Feyre","feyre"],[" as High Fae alongside the other six High Lords."]]}]}],"back":["amarantha","azriel","beron","blood-rite","cassian","devlon","eris","hewn-city","house-of-wind","illyrian-mountains","kallias","keir","lucien","madja","night-court","nyx","ritas","tamlin","tarquin","the-prison","under-the-mountain","velaris","viviane","winter-solstice"]},{"id":"lesser-fae","n":"Piskies & Lesser Fae","c":"creatures","k":null,"f":1,"d":2,"sub":[],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A broad category encompassing every Fae creature that falls below High Fae in the hierarchy of Prythian. Lesser Fae are enormously varied in appearance, ability, and temperament — they are not a single species but a classification."]]}]},{"t":"Notable species","p":[{"lead":"Piskies","segs":[["Small, quick, and mischievous. Not inherently dangerous but not entirely trustworthy either. They flock in groups and are drawn to bright or shiny things."]]},{"lead":"Boggarts","segs":[["Household creatures. They attach themselves to a dwelling and its inhabitants. Unseen under normal circumstances — their presence is felt rather than observed. They can turn malevolent if mistreated."]]},{"lead":"Kelpies","segs":[["Water-dwelling predators that lure victims in before drowning them. Encountered near bodies of water throughout Prythian."]]},{"lead":"Puca","segs":[["A shapeshifting creature of wind and change that appears as someone known to its victim — its true face has never been reliably confirmed."]]},{"lead":"Water Wraith","segs":[["An iridescent-skinned lesser Fae with long dark hair and wholly black eyes that moves through water with unnatural grace and equally unnatural intent."]]},{"lead":"Picts","segs":[["A lesser Fae whose details have been largely lost to time — referenced in the oldest records of Prythian but rarely encountered in the modern courts."]]}]},{"t":"Notable","p":[{"segs":[["Lesser Fae occupy every level of Prythian society — some serve in court households, some live freely in the wild territories, and some are as dangerous as any High Fae."]]}]}],"back":["bargains","bog-of-oorid","hewn-city","illyrian-mountains","illyrians"]},{"id":"starfall","n":"Starfall & Nynsar","c":"events","k":"night","f":2,"d":2,"sub":[],"rows":[{"l":"When","v":[["A spring celebration observed across all courts of Prythian. Every court calls it Nynsar — except the "],["Night Court","night-court"],[", which marks the same date with Starfall."]]}],"sec":[{"t":"Nature","p":[{"segs":[["Prythian-wide, Nynsar is a joyful celebration marking the full arrival of spring — a release after the long darkness of winter. Where "],["Calanmai","calanmai"],[" is sacred and ritualistic, Nynsar is celebratory. Specific traditions vary by court."]]}]},{"t":"Starfall — Night Court","p":[{"segs":[["On this same night, shooting stars cascade across the "],["Night Court","night-court"],["’s sky in a phenomenon unique to its territory. The stars are not merely atmospheric — they are sentient, living things that fall and streak across the sky in brilliant green before vanishing. The "],["Night Court","night-court"],[" gathers on rooftops and open spaces to watch them pass, and it is tradition to dance beneath them. It is considered the most beautiful night in the "],["Night Court","night-court"],["’s calendar. "],["Velaris","velaris"],[" comes alive for it entirely."]]}]},{"t":"Notable","p":[{"segs":[["Starfall is one of the few nights where the "],["Night Court","night-court"],["’s usual political tensions dissolve entirely. It belongs to everyone within "],["Velaris","velaris"],["’s borders — no hierarchy, no court politics. Just the green-lit sky and those watching it fall."]]}]}],"back":[]},{"id":"calanmai","n":"Calanmai (Fire Night)","c":"events","k":"spring","f":1,"d":1,"sub":[],"rows":[{"l":"When","v":[["The first night of spring. Marks the turning of the season across Prythian and the "],["Mortal Lands","mortal-lands"],["."]]}],"sec":[{"t":"Nature","p":[{"segs":[["The most sacred ritual of the "],["Spring Court","spring-court"],[". Bonfires are lit across the land as the High Lord performs the Great Rite — a ritual that releases magic directly into the earth, regenerating the land and ensuring the season takes hold."]]}]},{"t":"The Great Rite","p":[{"segs":[["The High Lord is overtaken by a primal magic on Calanmai that transforms him into something beyond himself — the Hunter. He is not entirely in control of himself during this state. He hunts the white stag, then seeks the Maiden — a female who has been chosen or who presents herself willingly. The two enter the sacred cave together. What happens inside is the Rite itself — a consummation that channels the raw magic of the land through the High Lord and releases it into the earth. It is carnal, ancient, and not entirely voluntary in its compulsion. The magic chooses. The High Lord is as much vessel as participant."]]}]},{"t":"Notable","p":[{"segs":[["Calanmai is observed with reverence across Prythian. The bonfires and free mingling of Fae on that night are Prythian-wide traditions. Interrupting or interfering with the Great Rite is considered one of the gravest violations in Prythian."]]}]}],"back":["spring-court","starfall"]},{"id":"peregryns","n":"Peregryns","c":"creatures","k":"dawn","f":3,"d":3,"sub":[["Winged soldiers — "],["Dawn Court","dawn-court"],[", Prythian"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A winged species of Fae serving as the standing army of the "],["Dawn Court","dawn-court"],[". Distinct from "],["Illyrians","illyrians"],[" — their wings, build, and culture are entirely their own."]]}]},{"t":"Appearance","p":[{"segs":[["Winged. Beyond this, canon detail on their precise appearance is limited. Their wings are described as large enough for sustained aerial combat."]]}]},{"t":"Notable","p":[{"segs":[["The peregryns are "],["Thesan","thesan"],["’s primary military force and his most significant contribution to the alliance against "],["Hybern","king-of-hybern"],[". They fought in the final battle and are considered one of the most distinctive fighting forces in Prythian — their aerial capabilities making them formidable in open combat. They are fiercely loyal to "],["Thesan","thesan"],[". Beyond their military function and their role in the war against "],["Hybern","king-of-hybern"],[", canon detail on peregryn culture, hierarchy, and society is sparse."]]}]}],"back":["dawn-court","thesan"]},{"id":"illyrians","n":"Illyrians","c":"creatures","k":"night","f":2,"d":2,"sub":[],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A subspecies of Fae defined by large, bat-like wings and a culture built entirely around warfare and physical dominance. They are not High Fae — the nobility of the "],["Hewn City","hewn-city"],[" considers them "],["Lesser Fae","lesser-fae"],[", a designation Illyrians themselves fiercely contest."]]}]},{"t":"Appearance","p":[{"segs":[["Large, powerfully built. Dark hair and tan skin are common. Wings are massive — spanning significantly wider than their bodies — and are both a point of pride and a vulnerability. Wing membranes tear easily and are considered one of the few reliable ways to ground an Illyrian in combat."]]}]},{"t":"Notable","p":[{"segs":[["Illyrian society is organized around war camps, each with its own hierarchy. Their culture is deeply patriarchal — females are frequently clipped, their wings cut to prevent flight and enforce subservience. Combat is the primary measure of worth. They are considered the most formidable ground and aerial warriors in Prythian. Illyrian soldiers form the backbone of the "],["Night Court","night-court"],["’s military. Full warrior status is earned through the Rite — a brutal trials event culminating in reaching the summit of "],["Ramiel","illyrian-mountains"],[", the most sacred peak in the Illyrian "],["mountains","illyrian-mountains"],["."]]}]}],"back":["azriel","blood-rite","cassian","devlon","emerie","enalius","hewn-city","illyrian-mountains","madja","nephelle","night-court","nyx","peregryns","rhysand","valkyries"]},{"id":"azriel","n":"Azriel","c":"characters","k":"night","f":2,"d":6,"sub":[["Spymaster of the "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Tall and lean with short tousled dark hair, golden-hazel eyes, and massive "],["Illyrian","illyrians"],[" wings. His most distinctive feature is his hands — scarred beyond recognition from burns suffered in childhood, the skin mangled and dark. He moves in near-total silence regardless of the situation."]]}]},{"t":"Personality","p":[{"segs":[["Azriel is shadow made flesh — quiet, watchful, and almost impossible to read. He speaks rarely and only when he has something worth saying. His stillness is not passivity; it is precision. He observes everything and reveals nothing, operating several steps ahead of everyone in the room without ever appearing to. Beneath the controlled exterior lives something far more turbulent — a capacity for feeling that runs dangerously deep, kept under lock because he has never believed he deserves otherwise. He is gentle with those he protects and utterly without mercy toward those who threaten them. His shadows are an extension of his mood — they betray him when nothing else will."]]}]},{"t":"Lore","p":[{"segs":[["Illyrian","illyrians"],["-born bastard. Spent his childhood locked in a cell by his father’s legitimate family — his hands were burned there. "],["Rhysand","rhysand"],["’s spymaster and the "],["Night Court","night-court"],["’s most feared intelligence operative. Wields the "],["Truth-Teller","truth-teller"],[" — one of two weapons forged from the "],["Cauldron","cauldron"],[" to defeat the "],["Daglan","daglan"],[". His shadows are sentient and gather information independently. He is the "],["Night Court","night-court"],["’s appointed liaison to the "],["Prison","the-prison"],[" — a role he despises, as the "],["Prison","the-prison"],["’s wards strip him of his power and his shadows entirely."]]}]}],"back":["blood-rite","cassian","devlon","gwyn","illyrian-mountains","nephelle","ritas","the-prison","truth-teller","winter-solstice"]},{"id":"winter-solstice","n":"Winter Solstice","c":"events","k":"night","f":4,"d":4,"sub":[],"rows":[{"l":"When","v":[["The longest night of the year. Observed across all courts of Prythian, though traditions vary significantly by court."]]}],"sec":[{"t":"Nature","p":[{"segs":[["A celebration marking midwinter — the peak of the dark season before the slow return of light. In the "],["Night Court","night-court"],[" it is the most significant holiday of the winter calendar, observed with gift-giving, feasting, and the gathering of those closest to one another."]]}]},{"t":"Night Court traditions","p":[{"segs":[["It is customary to give gifts — both to those you love and to those you serve alongside. The exchange is personal rather than political. Feasting is central, as is the gathering of the Inner Circle. Among "],["Rhysand","rhysand"],[", "],["Cassian","cassian"],[", and "],["Azriel","azriel"],[", a snowball fight at "],["Rhysand","rhysand"],["’s family cabin in the "],["mountains","illyrian-mountains"],[" has become a standing Winter Solstice tradition — chaotic, competitive, and taken with surprising seriousness by all three. The holiday carries genuine warmth in the "],["Night Court","night-court"],[" — one of the few occasions where even the most guarded allow themselves something resembling softness."]]}]},{"t":"Notable","p":[{"segs":[["Winter Solstice traditions differ court to court. Beyond "],["Velaris","velaris"],[", specific customs for the other courts are not fully described."]]}]}],"back":[]},{"id":"cassian","n":"Cassian","c":"characters","k":"night","f":2,"d":5,"sub":[["General of the "],["Night Court","night-court"],["’s "],["Illyrian","illyrians"],[" armies"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Massive, warrior-built with broad shoulders and hazel eyes. Dark hair tied back into a warriors knot, tan skin, and enormous "],["Illyrian","illyrians"],[" wings. His body is covered in battle scars — worn without apology."]]}]},{"t":"Personality","p":[{"segs":[["Cassian is all heat and momentum — loud, brash, and disarmingly warm beneath the swagger. He leads with his body before his mind and has never once backed down from a fight he believed in. His humor is broad and relentless, deployed even in the worst circumstances, because levity is how he survives darkness. Beneath the bravado lives something fiercely earnest — Cassian loves completely and without strategy, which is both his greatest strength and his most exploitable vulnerability. He has a soldier’s loyalty: absolute, unconditional, and occasionally reckless. He does not know how to be halfway anything."]]}]},{"t":"Lore","p":[{"segs":[["Illyrian","illyrians"],["-born bastard of unknown parentage — one of three bastard-born members of the Inner Circle alongside "],["Azriel","azriel"],[". Completed the "],["Illyrian","illyrians"],[" "],["Blood Rite","blood-rite"],[" alongside "],["Rhysand","rhysand"],[" and "],["Azriel","azriel"],[". Commander of the "],["Night Court","night-court"],["’s armies. One of the most formidable hand-to-hand combatants in Prythian. Fought in the final battle against "],["Hybern","king-of-hybern"],[" despite catastrophic wing injuries — refused to leave the field. Instrumental in training the reestablished "],["Valkyries","valkyries"],[" alongside "],["Nesta","nesta"],[" and "],["Gwyn","gwyn"],["."]]}]}],"back":["blood-rite","devlon","house-of-wind","illyrian-mountains","nesta","ritas","valkyries","winter-solstice"]},{"id":"valkyries","n":"Valkyries","c":"creatures","k":"night","f":3,"d":5,"sub":[],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["An ancient order of female warriors, distinct from "],["Illyrian","illyrians"],[" fighters in both technique and philosophy. Where "],["Illyrians","illyrians"],[" fight with brute power and aggression, Valkyries fight with precision, adaptability, and the use of an opponent’s strength against them. They are not the bigger force in the room. They are the smarter one."]]}]},{"t":"History","p":[{"segs":[["The Valkyrie order was nearly wiped out during a battle at "],["Ramiel","illyrian-mountains"],[" — their numbers devastated, their traditions nearly lost. For generations the order existed in name only, their techniques surviving in fragments and memory. The order was reestablished in "],["Velaris","velaris"],[" beneath the "],["House of Wind","house-of-wind"],[" by "],["Nesta Archeron","nesta"],[", "],["Gwyneth Berdara","gwyn"],[", and "],["Emerie","emerie"],[" — three females who completed the "],["Blood Rite","blood-rite"],[" together, the first to do so in the order’s reestablished history."]]}]},{"t":"Notable","p":[{"segs":[["Valkyrie training is grueling and methodical — built on technique over raw power, making it accessible to those without "],["Illyrian","illyrians"],[" strength or wingspan. The order trains in the "],["library","the-library"],[" beneath the "],["House of Wind","house-of-wind"],[" under "],["Cassian","cassian"],["’s combat instruction. Completing the "],["Blood Rite","blood-rite"],[" is considered the ultimate proof of Valkyrie warriorhood. The three who reestablished the order did so without wings, without magic, and against every odd the Rite placed in front of them."]]}]}],"back":["cassian","emerie","gwyn","house-of-wind","nesta"]},{"id":"varian","n":"Varian","c":"characters","k":"summer","f":2,"d":4,"sub":[["Captain of the Guard — "],["Summer Court","summer-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Dark-skinned and powerfully built with silver hair that marks him as distinctly "],["Summer Court","summer-court"],[". Carries himself with the contained readiness of someone who has never once been caught off guard."]]}]},{"t":"Personality","p":[{"segs":[["Varian is economy of motion and word — he does not waste either. He is observant, precise, and quietly authoritative in a way that does not require announcement. His loyalty to "],["Tarquin","tarquin"],[" is absolute and without condition. He is not cold but he is not warm in any conventional sense — he operates at a temperature that is entirely his own. Those who know him well enough describe something underneath the soldier’s discipline that is considerably more complicated than it appears."]]}]},{"t":"Lore","p":[{"segs":[["Tarquin","tarquin"],["’s Second and captain of his guard. One of the "],["Summer Court","summer-court"],["’s most formidable warriors. Fought in the alliance against "],["Hybern","king-of-hybern"],[" and was present at the final battle. His connection to "],["Amren","amren"],[" — forged during the war — is one of the more unlikely pairings in Prythian’s recent history, given that "],["Amren","amren"],[" is an ancient being of consuming power and Varian is, by any measure, a mortal-adjacent Fae soldier. He pursued her anyway."]]}]}],"back":[]},{"id":"nesta","n":"Nesta Archeron","c":"characters","k":"night","f":1,"d":5,"sub":[],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Tall and imperious with blonde hair and steel-blue eyes. She holds herself like a weapon at rest — spine straight, chin up, expression carved from cold stone. Beautiful in a way that is entirely intentional and entirely forbidding."]]}]},{"t":"Personality","p":[{"segs":[["Nesta is a sword that learned to be a person and never quite finished the lesson. She is brutal in her honesty, withering in her contempt, and virtually immovable once she has decided something. Her coldness is not absence of feeling — it is the opposite. Nesta feels everything at a magnitude that would break most people and has built walls of ice and cruelty to survive it. She does not ask for help. She does not show weakness. She does not forgive easily, including herself. Beneath the fortress is someone capable of extraordinary loyalty and ferocity on behalf of those she claims — but she will make you earn the right to see it. She has a particular talent for identifying exactly what will hurt someone most and a conscience that punishes her for using it."]]}]},{"t":"Lore","p":[{"segs":[["Born mortal. Was dragged into the "],["Cauldron","cauldron"],[" during "],["Hybern","king-of-hybern"],["’s attack and forcibly transformed into High Fae — but unlike "],["Elain","elain"],[", she fought back. She took power directly from the "],["Cauldron","cauldron"],[" during her transformation, making her one of the only beings in existence capable of wielding the "],["Dread Trove","dread-trove"],[". Her power is death itself — she can sense it, call it, and wield it. She later trained as a "],["Valkyrie","valkyries"],[" and was instrumental in reestablishing the "],["Valkyrie","valkyries"],[" order alongside "],["Cassian","cassian"],[" and "],["Gwyn","gwyn"],["."]]}]}],"back":["ataraxia","cassian","clotho","elain","emerie","gwyn","house-of-wind","king-of-hybern","lanthys","mr-archeron","valkyries"]},{"id":"gwyn","n":"Gwyneth Berdara","c":"characters","k":"night","f":5,"d":5,"sub":[["Priestess — The "],["Library","the-library"],[", "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Slight with red hair, teal eyes, and pointed ears that mark her as part-nymph. Pretty in a way she has spent considerable effort making easy to overlook."]]}]},{"t":"Personality","p":[{"segs":[["Gwyn is brightness that learned to hide itself and is slowly, painstakingly learning to shine again. She is quick-witted and sharp-tongued when she feels safe enough to let it show — her humor surfaces like sunlight through cloud cover, unexpected and warm. She is competitive in a way she pretends is casual and isn’t. She sings the way other people confess things. Her courage is not the loud kind — it is the kind that gets up every single day and chooses to keep going despite every reason not to."]]}]},{"t":"Lore","p":[{"segs":[["Half-nymph, half-Fae. Was serving as a priestess in Sangravah when it was attacked — she was one of only two survivors. "],["Azriel","azriel"],[" saved her from the attack and took her to the "],["library","the-library"],[" to heal where she took sanctuary among the priestesses. Her trauma was a driving factor. She later chose to train as a "],["Valkyrie","valkyries"],[" alongside "],["Nesta","nesta"],[" and "],["Emerie","emerie"],[" — one of the three who reestablished the order. Completed the "],["Blood Rite","blood-rite"],[". Her singing ability is noted as extraordinary even by Prythian’s standards."]]}]}],"back":["cassian","emerie","house-of-wind","nesta","valkyries"]},{"id":"clotho","n":"Clotho","c":"characters","k":"night","f":5,"d":5,"sub":[["Head Priestess — The "],["Library","the-library"],[", "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Clotho is never fully seen. She communicates through written notes passed beneath a screen — her face and body deliberately kept from view. What little is visible suggests someone who has chosen invisibility as both armor and identity."]]}]},{"t":"Personality","p":[{"segs":[["Clotho leads without presence in the conventional sense — no raised voice, no visible authority, no performance of power. And yet the "],["Library","the-library"],[" runs entirely on her will. She communicates in writing, precisely and without waste. Her kindness is structural — she built a sanctuary and maintains it with absolute dedication. She does not ask about the past of those who come to her. She does not require explanation or justification. She simply opens the door. That quality, in Prythian, is rarer than any magic."]]}]},{"t":"Lore","p":[{"segs":[["Head Priestess of the "],["Library","the-library"],[" beneath the "],["House of Wind","house-of-wind"],[". Oversees the sanctuary it provides to those who seek refuge there. The circumstances that brought her to the "],["Library","the-library"],[" and led to her choosing concealment are her own — she does not share them and is not asked to. She was instrumental in supporting "],["Nesta Archeron","nesta"],[" during "],["Nesta","nesta"],["’s time of service in the "],["Library","the-library"],[", recognizing something in her worth cultivating long before anyone else did."]]}]}],"back":[]},{"id":"emerie","n":"Emerie","c":"characters","k":"night","f":5,"d":5,"sub":[["Valkyrie","valkyries"],[" — "],["Illyrian","illyrians"],[", "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Dark-skinned with black hair, dark eyes, and "],["Illyrian","illyrians"],[" wings. Tall and lean with the quiet physical competence of someone who has been surviving hostile circumstances her entire life."]]}]},{"t":"Personality","p":[{"segs":[["Emerie is steady where others are volatile — grounded, dry-humored, and deeply practical. She does not trust easily or quickly, and she does not pretend otherwise. Her warmth emerges slowly and deliberately, offered only when she has decided someone has earned it. She has a soldier’s economy of expression — she says what she means, means what she says, and wastes nothing on performance. Beneath the reserve is someone who has wanted more than the life she was handed for a very long time and has never once stopped quietly fighting for it."]]}]},{"t":"Lore","p":[{"segs":[["Illyrian","illyrians"],["-born. Ran her family’s shop in "],["Windhaven","illyrian-mountains"],[" after her brother went to war and did not return. Her wings were clipped by her father — a common practice used to control "],["Illyrian","illyrians"],[" females. She chose to train as a "],["Valkyrie","valkyries"],[" alongside "],["Nesta","nesta"],[" and "],["Gwyn","gwyn"],[", one of the three who reestablished the order. Completing the "],["Blood Rite","blood-rite"],[" alongside them was both a personal and cultural act of defiance — an "],["Illyrian","illyrians"],[" female with clipped wings touching the monolith on "],["Ramiel","illyrian-mountains"],[" is without precedent."]]}]}],"back":["gwyn","valkyries"]},{"id":"amren","n":"Amren","c":"characters","k":"night","f":2,"d":3,"sub":[["Second-in-Command of the "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Small and slight with an otherworldly beauty that unsettles more than it attracts. Silver eyes that are distinctly not Fae. She looks like something poured into a Fae body that doesn’t entirely fit."]]}]},{"t":"Personality","p":[{"segs":[["Amren is ancient patience wrapped in razor wire. She speaks rarely and wastes nothing — not words, not energy, not mercy. Her affect is flat where others are expressive, precise where others are emotional. She finds mortal and Fae sentimentality faintly baffling and does not pretend otherwise. There is no performance to her coldness — it is simply what she is. She collects beautiful things with the detached appreciation of someone who has outlived everything she has ever known. Her loyalty to the Inner Circle is real but expressed in ways that do not resemble warmth until you know what to look for."]]}]},{"t":"Lore","p":[{"segs":[["Not originally Fae. Amren is an ancient being from another world who fell into Prythian and was given a Fae body as a vessel. Her true form is something of consuming, devastating power — not a creature of this world in any meaningful sense. She drinks blood to sustain herself. During the final battle against "],["Hybern","king-of-hybern"],[" she shed her Fae body entirely to become her true form, an act that was not expected to be survivable. She was restored to a Fae body afterward at great cost and is diminished from what she was — though still formidable by any standard."]]}]}],"back":["tarquin","varian"]},{"id":"morrigan","n":"Morrigan","c":"characters","k":"night","f":2,"d":3,"sub":[["Third-in-Command of the "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Tall and striking with long golden hair, brown skin, and deep brown eyes. Built with a warrior’s strength beneath an appearance that has always been weaponized against her by those who underestimated it."]]}]},{"t":"Personality","p":[{"segs":[["Mor is sunshine with steel underneath — warm, magnetic, and social in a way that feels effortless but is partly performance. She is the heart of the Inner Circle in every practical sense; the one who holds the emotional center when everything else fractures. She laughs easily and loves fiercely, but there is a layer beneath the warmth that does not invite examination. She has spent centuries perfecting the art of being exactly what a room needs her to be while keeping her truest self behind carefully maintained walls. Her anger, when it finally surfaces, is not loud — it is devastating."]]}]},{"t":"Lore","p":[{"segs":[["Descended from the ruling nobility of the "],["Hewn City","hewn-city"],[" — "],["Keir","keir"],["’s daughter, which makes her bloodline politically significant and her relationship with her family one of profound and unresolved trauma. Her power is Truth — she can only travel to where she has been before or where she truly belongs. She is one of the most powerful Fae in Prythian in terms of raw ability. She is bisexual — a truth she has kept hidden from the Court of Nightmares for centuries out of survival. She was the first to find "],["Velaris","velaris"],[" after her family’s abuse drove her to flee."]]}]}],"back":["eris","hewn-city","keir","ritas"]},{"id":"feyre","n":"Feyre Archeron","c":"characters","k":"night","f":1,"d":2,"sub":[["High Lady of the "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Young, with sharp blue-grey eyes and brown hair. Slight but not fragile — her build reflects someone who survived on hunting and deprivation before anything else. Her hands are always slightly paint-stained."]]}]},{"t":"Personality","p":[{"segs":[["Feyre is quietly observant in a way that people consistently mistake for passivity — a mistake they tend to make only once. She processes the world visually, emotionally, and strategically in equal measure, often arriving at the right answer before she can articulate how she got there. She carries guilt like a second skin and has a deep, almost compulsive need to protect those she loves even at cost to herself. She is stubborn to the point of self-destruction. Her warmth is real but earned — she does not give trust easily and does not forgive betrayal at all. She paints the way other people breathe."]]}]},{"t":"Lore","p":[{"segs":[["Born mortal. Kept her family alive through hunting during years of poverty. Crossed into Prythian and was brought to "],["Tamlin","tamlin"],["’s manor under the terms of the Treaty. Completed three trials "],["Under the Mountain","under-the-mountain"],[" set by "],["Amarantha","amarantha"],[" — survived them, then was killed. Resurrected as High Fae by the seven High Lords, receiving a kernel of each High Lord’s power in the process — making her the only Fae in existence to hold abilities from all seven courts simultaneously."]]}]}],"back":["alis","amarantha","ianthe","mortal-queens","mr-archeron","nyx","ressina","rhysand","tamlin","tarquin","under-the-mountain"]},{"id":"elain","n":"Elain Archeron","c":"characters","k":"mortal","f":1,"d":3,"sub":[],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Soft and golden — warm brown hair, hazel eyes, and a gentle prettiness that invites trust. She looks exactly like what she is on the surface and nothing like what she is underneath."]]}]},{"t":"Personality","p":[{"segs":[["Elain is frequently underestimated and has never once corrected anyone who did so. She moves through the world quietly, tending her garden, saying the right things at the right moments, and noticing everything. Her gentleness is real — but it is not weakness, and confusing the two is an error. She has an instinct for people that borders on uncanny — she knows what someone needs before they do and has a gift for offering it without making them feel exposed. She grieves privately and completely. She does not process loss outwardly; she goes somewhere inside herself and returns changed, without explanation."]]}]},{"t":"Lore","p":[{"segs":[["Born mortal. Was dragged into the "],["Cauldron","cauldron"],[" alongside "],["Nesta","nesta"],[" and transformed into High Fae against her will. The experience shattered her — she spent months barely present, staring at nothing. She emerged from that period with the gift of a Seer — she receives visions of past, present, and future that come without warning or context and must be interpreted. Her Seer ability is not fully understood or controlled. She has an affinity for growing things that borders on magical. Her court allegiance and future role in Prythian’s politics remain unresolved."]]}]}],"back":["graysen","king-of-hybern","nesta"]},{"id":"lucien","n":"Lucien Vanserra","c":"characters","k":"autumn","f":1,"d":3,"sub":[["Emissary — Former "],["Spring Court","spring-court"],[", Son of "],["Helion","helion"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Tall and lean with fox-red hair and one eye of russet brown — the other is mechanical, a gift from "],["Rhysand","rhysand"],[", made of metal and whirring with its own intelligence. The mechanical eye sees things the other cannot. A scar bisects that side of his face."]]}]},{"t":"Personality","p":[{"segs":[["Lucien is wit worn as armor — sharp, self-deprecating, and deployed so consistently it is easy to mistake for his entire personality. Underneath is someone who has survived the "],["Autumn Court","autumn-court"],[", exile, loss, and years of watching someone he cared for be slowly diminished, and has come out of it more bruised than broken. He is fundamentally decent in a world that has not rewarded him for it. His loyalty is genuine and occasionally poorly placed. He is caught perpetually between who he was born to be and who circumstance made him, and has not yet resolved which one wins."]]}]},{"t":"Lore","p":[{"segs":[["Raised as the son of "],["Beron Vanserra","beron"],[" in the "],["Autumn Court","autumn-court"],[" — his true father is "],["Helion","helion"],[" of the "],["Day Court","day-court"],[", a secret kept for decades. Was exiled from the "],["Autumn Court","autumn-court"],[" after killing a lord who murdered his lover. Became "],["Tamlin","tamlin"],["’s emissary and closest companion. His mechanical eye was made by "],["Rhysand","rhysand"],[" after he lost his own. Served as emissary through the war against "],["Hybern","king-of-hybern"],[". His court allegiance following the war remains unresolved — he is biologically "],["Helion","helion"],["’s heir to the "],["Day Court","day-court"],[", was raised "],["Autumn Court","autumn-court"],[", and served the "],["Spring Court","spring-court"],[". He belongs to all three and is claimed fully by none."]]}]}],"back":["autumn-court","beron","helion","jesminda","vassa"]},{"id":"kallias","n":"Kallias","c":"characters","k":"winter","f":2,"d":3,"sub":[["High Lord of the "],["Winter Court","winter-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Pale-skinned with white hair and ice-blue eyes — he looks like his court made flesh. Lean and precise in his bearing, with a stillness that reads as either calm or threat depending on the circumstance."]]}]},{"t":"Personality","p":[{"segs":[["Kallias is measured and deliberate — a High Lord who leads with his head and keeps his heart for those who have earned it. He is not cold in the way "],["Beron","beron"],[" is cold; there is genuine warmth in him, reserved and carefully distributed. He is fiercely devoted to "],["Viviane","viviane"],[" in a way he does not bother concealing from those he trusts. His political instincts are sound and his patience is considerable. He does not forgive quickly or cheaply — fifty years of imprisonment under "],["Amarantha","amarantha"],[" left marks that do not simply fade."]]}]},{"t":"Lore","p":[{"segs":[["High Lord of the "],["Winter Court","winter-court"],[". Was among the High Lords whose power was stripped by "],["Amarantha","amarantha"],[" and who were held "],["Under the Mountain","under-the-mountain"],[" for fifty years. During his absence, "],["Viviane","viviane"],[" held the "],["Winter Court","winter-court"],[" together — an act of leadership he has never minimized or taken credit for. His "],["mate","mating-bond"],[" is "],["Viviane","viviane"],[". Joined the alliance against "],["Hybern","king-of-hybern"],[" and brought the "],["Winter Court","winter-court"],["’s forces to the final battle. His relationship with "],["Rhysand","rhysand"],[", like most of the High Lords, required rebuilding after "],["Amarantha","amarantha"],["’s fall — a process complicated by fifty years of enforced proximity to "],["Rhysand","rhysand"],["’s apparent collaboration with her."]]}]}],"back":["viviane","winter-court"]},{"id":"jurian","n":"Jurian","c":"characters","k":"mortal","f":1,"d":3,"sub":[["Human","mortal-lands"],[" Commander — Resurrected"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Tall, dark-haired, battle-hardened. Shaped entirely by war and its costs."]]}]},{"t":"Personality","p":[{"segs":[["Arrogant and difficult, but capable of extraordinary strategic patience and genuine devotion to "],["human","mortal-lands"],[" freedom. Not a hero. Not a villain. A man who did terrible things for reasons that were not entirely wrong."]]}]},{"t":"Lore","p":[{"segs":[["Commander of the "],["human","mortal-lands"],[" armies during the War. Seduced "],["Amarantha","amarantha"],["’s sister Clythia to extract military intelligence, then killed her. "],["Amarantha","amarantha"],[" bound his soul into a ring and necklace made from his own eye and finger bone — forcing him to remain conscious for centuries. Resurrected by the King of "],["Hybern","king-of-hybern"],[" using the "],["Cauldron","cauldron"],[". Appeared to serve "],["Hybern","king-of-hybern"],[" — exposing "],["Velaris","velaris"],[" to the "],["Mortal Queens","mortal-queens"],[". It was a deception. Jurian had been working against "],["Hybern","king-of-hybern"],[" from the moment of his resurrection and brought a "],["human","mortal-lands"],[" army to the final battle."]]}]}],"back":["amarantha"]},{"id":"tarquin","n":"Tarquin","c":"characters","k":"summer","f":2,"d":3,"sub":[["High Lord of the "],["Summer Court","summer-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Dark-skinned with white hair and pale blue eyes — striking in the way of the "],["Summer Court","summer-court"],["’s nobility, built like someone who has never forgotten that power requires both presence and restraint."]]}]},{"t":"Personality","p":[{"segs":[["Tarquin is the most idealistic High Lord in Prythian and has paid for it repeatedly without becoming cynical. He leads with principle over strategy, which his contemporaries consider naive and which has proven them wrong more than once. He is open where other High Lords are guarded, direct where they are oblique, and genuinely believes that trust can be extended before it is earned — a quality that has been exploited and vindicated in roughly equal measure. His anger, when it surfaces, is clean and without cruelty. He does not enjoy punishment. He issues it anyway when he must."]]}]},{"t":"Lore","p":[{"segs":[["The youngest High Lord in Prythian’s history at the time of his claiming. Holds the half of the "],["Book of Breathings","book-of-breathings"],[" entrusted to the "],["Summer Court","summer-court"],[". Extended hospitality and tentative alliance to "],["Rhysand","rhysand"],[" and "],["Feyre","feyre"],[" — an act of trust that was repaid with the theft of his half of the "],["Book of Breathings","book-of-breathings"],[". Issued "],["blood rubies","blood-rubies"],[" against "],["Feyre","feyre"],[", "],["Rhysand","rhysand"],[", and "],["Amren","amren"],[" in response. Rescinded the decree and joined the alliance against "],["Hybern","king-of-hybern"],[" — the first High Lord to formally offer alliance to the "],["Night Court","night-court"],[". Brought his armies and his ocean power to the final battle."]]}]}],"back":["summer-court","varian"]},{"id":"tamlin","n":"Tamlin","c":"characters","k":"spring","f":1,"d":3,"sub":[["High Lord of the "],["Spring Court","spring-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Massive and golden — broad shouldered with blonde hair, green eyes, and the kind of physical presence that fills a room before he speaks. His beast form is among the most formidable in Prythian — claws, fangs, and something that is no longer entirely Fae."]]}]},{"t":"Personality","p":[{"segs":[["Tamlin is a good man shaped by trauma into something that cannot always tell the difference between protection and possession. He leads with feeling rather than strategy, which makes him genuine and makes him dangerous in equal measure. He does not do nuance well — his world tends toward absolutes, and when those absolutes fail him he has no framework to recover. He is not cruel by nature but he is capable of cruelty by paralysis — of failing people catastrophically through inaction, fear, and the inability to confront what he has become. He carries guilt like a wound he will not let close."]]}]},{"t":"Lore","p":[{"segs":[["High Lord of the "],["Spring Court","spring-court"],[". His father and brothers were killed by "],["Rhysand","rhysand"],["’s father — a political assassination that shaped him entirely. Was cursed by "],["Amarantha","amarantha"],[", the curse requiring a mortal girl to fall in love with him of her own free will within 49 years or it would become permanent. Kept "],["Feyre","feyre"],[" in the "],["Spring Court","spring-court"],[" under that curse. Failed to protect her "],["Under the Mountain","under-the-mountain"],[". Later collaborated with "],["Hybern","king-of-hybern"],[" against "],["Rhysand","rhysand"],[" — an act of political devastation that contributed directly to the war. Ultimately turned against "],["Hybern","king-of-hybern"],[" in the final battle. His court was left diminished and broken by his failures of leadership."]]}]}],"back":["alis","feyre","ianthe","lucien","spring-court"]},{"id":"beron","n":"Beron Vanserra","c":"characters","k":"autumn","f":3,"d":3,"sub":[["High Lord of the "],["Autumn Court","autumn-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Red-haired and sharp-featured with the cold handsomeness of the "],["Autumn Court","autumn-court"],["’s nobility. He looks exactly like what he is — a man who has held power for a very long time and has never once doubted his right to it."]]}]},{"t":"Personality","p":[{"segs":[["Beron is political ambition stripped of everything that might make it sympathetic. He is not passionate or volatile — he is measured, calculating, and entirely without sentiment. He treats loyalty as a transaction, family as a resource, and power as the only currency worth holding. He is not the loudest presence in a room but he is frequently the most dangerous one. His cruelty is not impulsive — it is considered, which makes it worse. He has never once made a decision that did not serve Beron Vanserra first."]]}]},{"t":"Lore","p":[{"segs":[["High Lord of the "],["Autumn Court","autumn-court"],[" and one of the most politically treacherous figures in Prythian. His power is fire — formidable and precise. Was among the High Lords whose power was stripped by "],["Amarantha","amarantha"],[". Refused alliance against "],["Hybern","king-of-hybern"],[" until forced by circumstance. His wife carried on a decades-long affair with "],["Helion","helion"],[" of the "],["Day Court","day-court"],[" — "],["Lucien","lucien"],[" is "],["Helion","helion"],["’s son, not Beron’s, a fact Beron may or may not know. His eldest son "],["Eris","eris"],[" serves as a secret spy for "],["Rhysand","rhysand"],[" against him. His court is held together by fear rather than loyalty and reflects his rule entirely."]]}]}],"back":["eris","helion","jesminda","kallias","lucien"]},{"id":"keir","n":"Keir","c":"characters","k":"night","f":2,"d":2,"sub":[["Lord of the "],["Hewn City","hewn-city"],[" — Court of Nightmares, "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Pale, dark-haired, and coldly handsome in the way of the "],["Hewn City","hewn-city"],["’s nobility — everything about him is designed to project dominance and contempt simultaneously."]]}]},{"t":"Personality","p":[{"segs":[["Keir is political cruelty refined to an art form. He operates entirely within the transactional logic of the Court of Nightmares — power is currency, weakness is opportunity, and sentiment is a liability to be exploited. He is not loud or volatile; he is precise and patient, which makes him considerably more dangerous than a cruder villain. He has never once in his life prioritized anything above his own advancement. His cruelty toward his daughter ("],["Morrigan","morrigan"],[") is not incidental — it is structural, deliberate, and tells you everything you need to know about him."]]}]},{"t":"Lore","p":[{"segs":[["Day-to-day ruler of the "],["Hewn City","hewn-city"],[" beneath "],["Rhysand","rhysand"],[". His authority in the Court of Nightmares is real but entirely contingent on "],["Rhysand","rhysand"],["’s tolerance of him — a fact he is careful never to forget. His daughter is "],["Morrigan","morrigan"],[", whose power and bloodline he attempted to weaponize through a political marriage arrangement that constituted one of the most significant betrayals in the Inner Circle’s history. His relationship with "],["Rhysand","rhysand"],[" is one of carefully maintained mutual performance — Keir plays his role in the Court of Nightmares and "],["Rhysand","rhysand"],[" allows him to keep it."]]}]}],"back":["hewn-city","morrigan"]},{"id":"eris","n":"Eris Vanserra","c":"characters","k":"autumn","f":2,"d":3,"sub":[["Crown Prince — "],["Autumn Court","autumn-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Tall and lean with the trademark "],["Autumn Court","autumn-court"],[" coloring — red hair, sharp features, and an expression that gives nothing away. He looks like his father’s son and has spent considerable effort ensuring no one looks deeper than that."]]}]},{"t":"Personality","p":[{"segs":[["Eris is performance layered over performance — every interaction is a calculation, every word placed with surgical precision. He has lived his entire life in the most politically treacherous court in Prythian under a father who would destroy him without hesitation, and he has survived it by becoming exactly as cold and ruthless as the court requires while keeping everything real about himself completely invisible. He is not his father. He has worked very hard to make sure no one knows that. His dry wit surfaces occasionally like a tell he has never quite managed to eliminate. He plays the long game better than anyone in Prythian except possibly "],["Rhysand","rhysand"],["."]]}]},{"t":"Lore","p":[{"segs":[["Eldest son of "],["Beron Vanserra","beron"],[" and heir to the "],["Autumn Court","autumn-court"],[". His history with "],["Morrigan","morrigan"],[" is one of the most contested and complicated in the Inner Circle’s past — he left her for dead on the "],["Autumn Court","autumn-court"],[" border after she was brutalized by her family, an act the Inner Circle has never forgiven. His account of that event differs from the version the Inner Circle holds. He became a spy for "],["Rhysand","rhysand"],[" against his own father — a fact kept in absolute secrecy. His ultimate allegiances and what he is truly working toward remain deliberately unclear."]]}]}],"back":["autumn-court","beron"]},{"id":"amarantha","n":"Amarantha","c":"characters","k":null,"f":1,"d":2,"sub":[["Former High Queen of Prythian — Deceased"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Red-gold hair, white skin, cold elegance worn like armor. Always wore two pieces of jewelry: a golden ring housing a glass ball containing "],["Jurian","jurian"],["’s living eye — his soul bound within it, still moving — and a golden necklace holding one of his finger bones."]]}]},{"t":"Personality","p":[{"segs":[["Cruelty that learned to wear a smile. Magnetic, theatrical, patient in her sadism. Intelligent enough to hold seven High Lords captive for fifty years and vain enough that it ultimately undid her."]]}]},{"t":"Lore","p":[{"segs":[["Hybern","king-of-hybern"],["’s most feared general during the War. Her sister Clythia was seduced and murdered by "],["Jurian","jurian"],[" — an act that defined everything she became. Bound "],["Jurian","jurian"],["’s soul into jewelry as living punishment. Slaughtered her own slaves rather than free them after the Treaty. Arrived in Prythian as an emissary, stripped the High Lords of their powers, and declared herself High Queen. Held the courts captive "],["Under the Mountain","under-the-mountain"],[" for fifty years. Kept "],["Rhysand","rhysand"],[" as her personal sex slave for the duration of her reign — an obsession he cultivated deliberately to keep her attention away from "],["Velaris","velaris"],[". Killed by "],["Feyre Archeron","feyre"],[" when "],["Feyre","feyre"],[" answered her riddle correctly. Her death broke her curses and freed the courts."]]}]}],"back":["alis","attor","beron","feyre","jurian","kallias","king-of-hybern","naga","rhysand","spring-court","tamlin","under-the-mountain","velaris","winter-court"]},{"id":"king-of-hybern","n":"The King of Hybern","c":"characters","k":"hybern","f":1,"d":3,"sub":[["Ruler of Hybern"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Ruddy-skinned with inky black hair framing a face considered plain compared to most High Fae. Muscular, appearing to be in his forties if he were "],["human","mortal-lands"],[". His black eyes burned with depthless hatred. He radiates the particular menace of someone who has never once been told no and made to accept it."]]}]},{"t":"Personality","p":[{"segs":[["The King of Hybern is not theatrical like "],["Amarantha","amarantha"],[" — he is simply certain. Certain of his power, certain of his right to take what he wants, certain that the Treaty was an insult to be corrected rather than a boundary to be respected. He does not monologue or perform. He plans, waits, and moves when the time is right. His patience is geological. His contempt for "],["humans","mortal-lands"],[" is absolute and entirely without heat — it is simply how he has organized the world. He is willing to negotiate peacefully when it serves him, fully intending betrayal from the outset."]]}]},{"t":"Lore","p":[{"segs":[["Ancient ruler of Hybern who fought as a loyalist during the War, refusing to free his "],["human","mortal-lands"],[" slaves and working to prevent "],["human","mortal-lands"],[" freedom. Rather than free his slaves after the Treaty, had "],["Amarantha","amarantha"],[" slaughter them instead. Spent the centuries following deliberately nurturing his people’s hatred and sense of injustice, letting Hybern sink into poverty and isolation to strengthen their resentment and hunger for war. Used the "],["Cauldron","cauldron"],[" to destroy the "],["Wall","the-wall"],[", forcibly transformed "],["Nesta","nesta"],[" and "],["Elain Archeron","elain"],[" into High Fae, and waged open war against Prythian and the "],["Mortal Lands","mortal-lands"],["."]]}]}],"back":["amarantha","amren","attor","beron","blood-rite","book-of-breathings","cassian","cauldron","dawn-court","day-court","graysen","ianthe","jurian","kallias","lucien","mortal-queens","mr-archeron","naga","nesta","peregryns","ressina","scythia","tamlin","tarquin","the-wall","varian","vassa","viviane","winter-court"]},{"id":"viviane","n":"Viviane","c":"characters","k":"winter","f":3,"d":3,"sub":[["Lady of the "],["Winter Court","winter-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Pale and dark-haired with the sharp, clean beauty of deep winter. She carries herself with the quiet authority of someone who held an entire court together alone for fifty years and has never once needed to announce it."]]}]},{"t":"Personality","p":[{"segs":[["Viviane is warmth inside a winter court — genuine, direct, and possessed of a dry humor that surfaces when least expected. She does not perform softness or strength; she simply is both. She is fiercely loyal, politically shrewd in a way she does not advertise, and entirely unintimidated by power — including "],["Rhysand","rhysand"],["’s. She says what she means. In a world of courts built on deception that quality is either refreshing or dangerous depending on who is in the room."]]}]},{"t":"Lore","p":[{"segs":[["Kallias","kallias"],["’s "],["mate","mating-bond"],[" and the Lady of the "],["Winter Court","winter-court"],[". While "],["Kallias","kallias"],[" was held captive "],["Under the Mountain","under-the-mountain"],[" for fifty years, Viviane ruled the "],["Winter Court","winter-court"],[" alone — keeping it intact, its people protected, and its enemies at bay without the support of a High Lord’s power. She joined the alliance against "],["Hybern","king-of-hybern"],[" and fought in the final battle. Her leadership during "],["Kallias","kallias"],["’s absence is considered one of the more remarkable acts of governance in Prythian’s recent history."]]}]}],"back":["kallias","winter-court"]},{"id":"alis","n":"Alis","c":"characters","k":"spring","f":1,"d":3,"sub":[["Spring Court","spring-court"],[" Servant — High Fae"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Takes the form of a slight female Fae with bark-like skin and leaves for hair — one of the lesser High Fae whose appearance reflects the natural world of the "],["Spring Court","spring-court"],["."]]}]},{"t":"Personality","p":[{"segs":[["Alis is loyal in the quiet, unglamorous way that actually means something — not to power or position but to people. She is practical, plain-spoken, and possessed of a dry warmth she does not advertise. She notices everything and says only what needs saying. Her courage operates without announcement — she does what is right and does not wait to be recognized for it."]]}]},{"t":"Lore","p":[{"segs":[["A servant in "],["Tamlin","tamlin"],["’s manor in the "],["Spring Court","spring-court"],[". One of the few beings in "],["Tamlin","tamlin"],["’s household who treated "],["Feyre","feyre"],[" with genuine care during her time there. Passed information to "],["Feyre","feyre"],[" at considerable personal risk — her nephews were held as leverage against her cooperation with "],["Amarantha","amarantha"],["’s regime. She later aided "],["Feyre","feyre"],[" again during "],["Feyre","feyre"],["’s return to the "],["Spring Court","spring-court"],[" to dismantle it from within. Her loyalty was never to the court’s politics — it was always to the people inside it."]]}]}],"back":[]},{"id":"devlon","n":"Devlon","c":"characters","k":"night","f":2,"d":5,"sub":[["Lord of Windhaven — "],["Illyrian","illyrians"],[" War Camp"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Built like every "],["Illyrian","illyrians"],[" male who has never once questioned his own authority — large, dark, and permanently set against anything that disrupts the order he has enforced his entire life."]]}]},{"t":"Personality","p":[{"segs":[["Devlon is tradition made flesh. He is not cruel for cruelty’s sake — he simply believes in the "],["Illyrian","illyrians"],[" way with the absolute conviction of someone who has never seriously entertained an alternative. He is suspicious of outsiders, resistant to change, and manages his camp with the particular stubbornness of a man who confuses longevity with correctness. He is not unintelligent. He simply applies his intelligence entirely in service of keeping things exactly as they are."]]}]},{"t":"Lore","p":[{"segs":[["Lord of Windhaven — the most prominent of the "],["Illyrian","illyrians"],[" war camps and the camp where "],["Rhysand","rhysand"],[", "],["Cassian","cassian"],[", and "],["Azriel","azriel"],[" trained. Permitted the three to enter the "],["Blood Rite","blood-rite"],[" despite their status as crossbreed and bastards — a politically significant decision. His relationship with "],["Cassian","cassian"],[" is one of permanent low-level antagonism. He has consistently resisted "],["Cassian","cassian"],["’s efforts to reform "],["Illyrian","illyrians"],[" treatment of females — including the practice of clipping. He represents the institutional resistance within "],["Illyrian","illyrians"],[" culture to any change in the order that has always served those at the top of it."]]}]}],"back":["blood-rite"]},{"id":"mortal-queens","n":"The Mortal Queens","c":"characters","k":"mortal","f":2,"d":3,"sub":[],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Six women of varying age and appearance. They present themselves with the careful pageantry of rulers who understand that mortals need their leaders to look like power."]]}]},{"t":"Personality","p":[{"segs":[["The Mortal Queens as a body operate on fear and self-preservation — they have ruled their people by controlling the narrative of what lies beyond the "],["Wall","the-wall"],[" for generations. Individually they vary, but collectively they are risk-averse, suspicious of Fae, and deeply reluctant to act in any way that might cost them their thrones. Two among them proved willing to betray their own people for the promise of immortality."]]}]},{"t":"Lore","p":[{"segs":[["Six queens who rule the "],["Mortal Lands","mortal-lands"],[" from a shared palace on the Continent. They hold one half of the "],["Book of Breathings","book-of-breathings"],[" — entrusted to them as part of the post-War order and surrenderable only by their own free will. When "],["Feyre","feyre"],[" and the Inner Circle came to them seeking the Book’s surrender to stop "],["Hybern","king-of-hybern"],[", four refused. Two — motivated by the promise of immortality offered by the King of "],["Hybern","king-of-hybern"],[" — betrayed the meeting entirely, exposing "],["Velaris","velaris"],["’s existence to "],["Hybern","king-of-hybern"],[" in exchange for being Made into something more than mortal. Their betrayal directly enabled "],["Hybern","king-of-hybern"],["’s war preparations. The remaining four queens ultimately surrendered their half of the Book when the cost of refusal became undeniable."]]}]}],"back":["book-of-breathings","jurian","mortal-lands","scythia","vassa"]},{"id":"theia","n":"Theia","c":"characters","k":null,"f":6,"d":6,"sub":[["Ancient Fae — Deceased or Departed"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Unknown. No reliable physical description survives in any complete form."]]}]},{"t":"Personality","p":[{"segs":[["Theia was a being of extraordinary courage and moral conviction — one of the few in her era willing to act against the "],["Daglan","daglan"],[" when doing so was not survivable by any reasonable calculation. She was not without cost or contradiction. Her choices saved the world and fractured it in equal measure."]]}]},{"t":"Lore","p":[{"segs":[["One of three Fae responsible for the defeat of the "],["Daglan","daglan"],[" — alongside "],["Fionn","fionn"],[" and an unknown third. Used the "],["Cauldron","cauldron"],[" to forge "],["Gwydion","gwydion"],[" and the "],["Truth-Teller","truth-teller"],[", the only weapons capable of killing their near-godlike rulers. Her role in the "],["Daglan","daglan"],["’s defeat makes her one of the most significant figures in Prythian’s prehistory. What became of her after the "],["Daglan","daglan"],["’s fall — whether she survived, departed, or was lost — is not fully known. Her legacy persists in the weapons she helped create and in bloodlines that carry more of her story than most realize."]]}]}],"back":["daglan","dusk-court","gwydion"]},{"id":"fionn","n":"Fionn","c":"characters","k":null,"f":6,"d":6,"sub":[["First and Only High King of Prythian — Deceased"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Unknown. No physical description survives in the text."]]}]},{"t":"Personality","p":[{"segs":[["Fionn was a leader of sufficient power and force of will to unite the seven courts under a single rule — a feat never accomplished before or since. Beyond that, the details of his character have been lost to time and deliberate erasure."]]}]},{"t":"Lore","p":[{"segs":[["The only High King Prythian has ever known. Rose to power in the approximately one thousand years of peace that followed the defeat of the "],["Daglan","daglan"],[". Wielded "],["Gwydion","gwydion"],[" — one of two weapons forged from the "],["Cauldron","cauldron"],[" to defeat the "],["Daglan","daglan"],[". His reign ended in betrayal — by his queen and by his most trusted general and friend. The specifics of that betrayal and the identities of those involved are among the most significant unresolved mysteries in Prythian’s history. After his death the concept of a High King died with him — the seven courts fractured back into independent rule and have remained so ever since. His legacy is the shadow that falls over every political alliance in Prythian. No High Lord since has attempted to unite the courts. Most consider what happened to Fionn a sufficient argument against trying."]]}]}],"back":["daglan","gwydion","theia","truth-teller"]},{"id":"ianthe","n":"Ianthe","c":"characters","k":"spring","f":2,"d":3,"sub":[["High Priestess — "],["Spring Court","spring-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Extraordinarily beautiful with pale gold hair, blue eyes, and the kind of carefully constructed appearance that is designed to inspire devotion. She wears the regalia of her office — the ceremonial robes and crown of the High Priestess — as though they were always meant for her specifically."]]}]},{"t":"Personality","p":[{"segs":[["Ianthe is ambition dressed as piety. She is charming, politically astute, and completely without scruple beneath a practiced veneer of spiritual authority. She collects powerful people the way others collect weapons — identifying what they need to hear and providing it with surgical precision. Her devotion is entirely to herself. Everything else is performance."]]}]},{"t":"Lore","p":[{"segs":[["High Priestess of the "],["Spring Court","spring-court"],[" and one of "],["Tamlin","tamlin"],["’s closest allies. Presented herself as "],["Feyre","feyre"],["’s friend and guide — was neither. Betrayed "],["Feyre","feyre"],[" and members of the Inner Circle to the King of "],["Hybern","king-of-hybern"],[", revealing their identities and locations in exchange for political favor. Collaborated with "],["Hybern","king-of-hybern"],[" throughout the war."]]}]}],"back":[]},{"id":"daglan","n":"The Daglan","c":"creatures","k":null,"f":5,"d":6,"sub":[["Ancient Rulers — Extinct or Departed"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Unknown. No reliable physical description survives. They are described only as near-gods and monsters — beings so far beyond ordinary Fae that the distinction between deity and predator was largely academic."]]}]},{"t":"Personality","p":[{"segs":[["The Daglan were not conquerors in any conventional sense — they were collectors. They ruled for millennia with the casual certainty of beings who had never encountered anything capable of stopping them. They created things for sport, hunted for pleasure, and treated the world and everything in it as existing for their entertainment. Their cruelty was not personal. That made it worse."]]}]},{"t":"Lore","p":[{"segs":[["The Daglan ruled the world long before the courts existed — before Prythian had a name. The Fae were their subjects, their playthings, and in some cases their creations. The Daglan gained control of the "],["Cauldron","cauldron"],[" and tied it to the soul of the world itself — a kill switch designed to protect their conquered territory from being taken by force. They used the "],["Cauldron","cauldron"],[" to create horrors they would then hunt for sport, some of which are still imprisoned in the "],["Prison","the-prison"],[". They were eventually defeated when "],["Theia","theia"],[", "],["Fionn","fionn"],[", and a third unknown Fae used the "],["Cauldron","cauldron"],[" to forge two weapons capable of killing them — "],["Gwydion","gwydion"],[" and the "],["Truth-Teller","truth-teller"],[". After their defeat approximately one thousand years of peace followed, during which the precursors of the seven courts took shape."]]}]}],"back":["azriel","cauldron","dusk-court","fionn","gwydion","theia","truth-teller"]},{"id":"thesan","n":"Thesan","c":"characters","k":"dawn","f":3,"d":3,"sub":[["High Lord of the "],["Dawn Court","dawn-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Warm-toned with dark hair and an understated elegance — he looks like someone who has never needed to be the loudest presence in a room and has never wanted to be."]]}]},{"t":"Personality","p":[{"segs":[["Thesan is measured, diplomatic, and even-tempered in a way that is neither weakness nor performance — it is simply his nature. He leads through consensus where other High Lords lead through dominance. He listens more than he speaks. In a council of seven High Lords he is frequently the one who finds the language that prevents the room from fracturing entirely."]]}]},{"t":"Lore","p":[{"segs":[["High Lord of the "],["Dawn Court","dawn-court"],[" and commander of the "],["peregryns","peregryns"],[" — Prythian’s most distinctive aerial fighting force. His court sits in a mountain palace set in the clouds. He is one of the more politically moderate High Lords, inclined toward alliance and negotiation over conflict. His lover is one of his own "],["peregryn","peregryns"],[" captains — a relationship he does not hide from those he trusts. Beyond his role in the alliance and his command of the "],["peregryns","peregryns"],[", Thesan and the "],["Dawn Court","dawn-court"],[" remain among the least documented of Prythian’s seven courts."]]}]}],"back":["dawn-court","peregryns"]},{"id":"helion","n":"Helion","c":"characters","k":"day","f":3,"d":3,"sub":[["High Lord of the "],["Day Court","day-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Dark-skinned and striking with a long, powerful build and an easy confidence in how he occupies space. He looks like someone who has never once been uncomfortable in his own skin and has no intention of starting."]]}]},{"t":"Personality","p":[{"segs":[["Helion is brilliant, hedonistic, and entirely unconcerned with pretense — what you see is what he wants you to see, and what he wants you to see is usually dazzling enough that you stop looking for what’s underneath. He is quick-minded and quick-tongued, the kind of person who makes every room more interesting simply by entering it. His warmth is genuine but his depths are carefully managed. He has loved someone he could not keep for decades and has never once stopped."]]}]},{"t":"Lore","p":[{"segs":[["High Lord of the "],["Day Court","day-court"],[" and one of the most tactically valuable High Lords in Prythian — his power is light and spell-breaking, capable of unraveling almost any enchantment or ward. His court houses more of Prythian’s history within its libraries than anywhere else in Prythian. Had a long affair with "],["Beron Vanserra","beron"],["’s wife — "],["Lucien Vanserra","lucien"],[" is his biological son, though "],["Lucien","lucien"],[" was raised in the "],["Autumn Court","autumn-court"],[" entirely unaware of this. Helion knew."]]}]}],"back":["beron","day-court","lucien"]},{"id":"vassa","n":"Vassa","c":"characters","k":"mortal","f":3,"d":3,"sub":[["Queen of "],["Scythia","scythia"],[" — Cursed Mortal"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Young and striking with red hair and blue eyes. When the curse takes hold at dawn she becomes something else entirely — a firebird of extraordinary power and beauty, all flame and wings, until darkness returns her to herself."]]}]},{"t":"Personality","p":[{"segs":[["Vassa is sharp-tongued, restless, and possessed of a gallows humor that has kept her sane through circumstances that would have broken most people. She is a queen down to her bones — not because of title or court politics but because she leads with her whole self, fully committed, fully present. She does not ask for pity and does not receive it gracefully. Her anger is clean and her loyalty is absolute once given."]]}]},{"t":"Lore","p":[{"segs":[["Queen of "],["Scythia","scythia"],[" and one of the six "],["Mortal Queens","mortal-queens"],[" — the only one who refused to betray her people to "],["Hybern","king-of-hybern"],[". Was cursed by a Fae lord named "],["Koschei","koschei"],[" — bound to transform into a firebird each day at dawn and return to "],["human","mortal-lands"],[" form only at nightfall, trapped on a lake "],["Koschei","koschei"],[" controls. "],["Lucien","lucien"],[" was sent to find and assist her following the war. Her curse remains unbroken. "],["Koschei","koschei"],[" is still at large — one of the most significant unresolved threats in Prythian’s world."]]}]}],"back":["koschei","koscheis-lake","mr-archeron","scythia"]},{"id":"gwydion","n":"Gwydion","c":"relics","k":null,"f":6,"d":6,"sub":[["Sword — Forged from the "],["Cauldron","cauldron"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["A sword unmistakable in presence — dark, ancient, and radiating something beyond ordinary steel. It does not look like a weapon that belongs to this age because it doesn’t."]]}]},{"t":"Personality","p":[{"segs":[["Gwydion is not merely a weapon — it has a will. It recognizes those it deems worthy and resists those it does not. It cannot be wielded fully by just anyone."]]}]},{"t":"Lore","p":[{"segs":[["One of two weapons forged from the "],["Cauldron","cauldron"],[" by "],["Theia","theia"],[", "],["Fionn","fionn"],[", and their companion to defeat the "],["Daglan","daglan"],[". Wielded by "],["Fionn","fionn"],[" — the only High King Prythian has ever known. After "],["Fionn","fionn"],["’s betrayal and death, Gwydion was lost. Its counterpart, the "],["Truth-Teller","truth-teller"],[", remained in Prythian — but Gwydion passed out of the known world entirely. Its current location and the question of who it will ultimately choose are among the most significant unresolved threads in Prythian’s history."]]}]}],"back":["ataraxia","daglan","fionn","theia","truth-teller"]},{"id":"ressina","n":"Ressina","c":"characters","k":"night","f":2,"d":3,"sub":[["Artist — "],["Velaris","velaris"],[", "],["Night Court","night-court"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Pale green skin and sable hair — distinctly Fae in a way that is neither High Fae nor easily categorized. She is quietly beautiful in the way of someone who has never once thought about it."]]}]},{"t":"Personality","p":[{"segs":[["Ressina is warmth without performance — the kind of person who makes space for others without needing acknowledgment for it. She is steady, community-minded, and possessed of a quiet courage that surfaces without fanfare when it is needed. She loves "],["Velaris","velaris"],[" the way people love things they have chosen rather than inherited."]]}]},{"t":"Lore","p":[{"segs":[["A painter and prominent figure in the Rainbow — "],["Velaris","velaris"],["’s artists’ quarter. One of the first residents of the Rainbow to befriend "],["Feyre Archeron","feyre"],[" and welcome her into the artistic community of "],["Velaris","velaris"],[" without agenda. Co-founded "],["Feyre","feyre"],["’s art studio in the Rainbow. During "],["Hybern","king-of-hybern"],["’s attack on "],["Velaris","velaris"],[" she did not flee — she defended the Rainbow with a rusted pipe, an act of ordinary extraordinary courage that cost her nothing and everything simultaneously. She represents what "],["Velaris","velaris"],[" actually is beneath its politics — a city worth protecting because of the people in it."]]}]}],"back":[]},{"id":"koschei","n":"Koschei","c":"characters","k":null,"f":3,"d":5,"sub":[["Death-God — Confined, the Continent"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Ancient and vast in a way that does not entirely fit inside a physical form. What he chooses to show of himself is deliberate and designed to unsettle."]]}]},{"t":"Personality","p":[{"segs":[["Patience and malice refined over an incomprehensible span of time. He does not rage or posture — he waits. He collects. He binds things to himself because ownership is the only language he speaks."]]}]},{"t":"Lore","p":[{"segs":[["One of the death-gods — ancient beings who predate Prythian’s courts entirely. Brother to the "],["Stryga","weavers-cottage"],[" and the "],["Bone Carver","bone-carver"],[". Confined to his lake on the Continent by wards that prevent him from leaving. His confinement does not prevent him from acting through others. He placed the firebird curse on "],["Vassa","vassa"],[" — binding her to his lake: "],["Koschei’s Lake","koscheis-lake"],[". Why he cursed her and what he ultimately wants remains unclear. He is considered one of the most significant unresolved threats in the wider world — not because he is free, but because of what he will do if he ever becomes so."]]}]}],"back":["scythia","vassa"]},{"id":"ouroboros","n":"The Ouroboros","c":"relics","k":null,"f":2,"d":2,"sub":[["Ancient object — Prythian"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["An ancient mirror of immense and dangerous power. It does not show the viewer their reflection — it shows them the truth of what they are. Not what they wish to be. Not what they present to the world. What they actually are, stripped of every defense and pretension."]]}]},{"t":"Appearance","p":[{"segs":[["Large, dark-framed, and deeply unsettling in the way of things that predate everything around them. Looking into it feels like being seen by something that has no interest in being kind about what it finds."]]}]},{"t":"Notable","p":[{"segs":[["Most who look into the Ouroboros lose their minds entirely. The mirror does not lie and it does not soften what it shows — it simply reflects truth at a magnitude most beings cannot survive. It predates the "],["Weaver","weavers-cottage"],[". It predates most things in Prythian with a name."]]}]}],"back":[]},{"id":"cretea","n":"Cretea","c":"places","k":null,"f":3,"d":3,"sub":[["Hidden island — Location unknown"]],"rows":[{"l":"Rulers","v":[["Drakon and Miryam"]]}],"sec":[{"t":"Geography","p":[{"segs":[["A hidden island whose location is known to almost no one. Deliberately concealed from the rest of the world — it does not appear on any map and its existence is not common knowledge in Prythian or the "],["Mortal Lands","mortal-lands"],["."]]}]},{"t":"People","p":[{"segs":[["Founded as a sanctuary for the fifty thousand "],["humans","mortal-lands"],[" Drakon and Miryam liberated from the Black Land following the War. Its people are those who were given freedom and chose to disappear with it rather than risk losing it again."]]}]},{"t":"Notable","p":[{"segs":[["Cretea’s existence was the final act of the War’s aftermath — Drakon and Miryam were reported dead, their deaths staged to allow them and their people to vanish entirely. The island was built on the principle that some things are worth protecting by making them invisible. Drakon and Miryam have ruled it together ever since. It resurfaces in Prythian’s awareness only when the stakes are high enough to justify breaking its concealment — which has happened exactly once in recorded history."]]}]}],"back":[]},{"id":"scythia","n":"Scythia","c":"places","k":"mortal","f":3,"d":3,"sub":[["Mortal Kingdom — The Continent"]],"rows":[{"l":"Ruler","v":[["Vassa","vassa"]]}],"sec":[{"t":"Geography","p":[{"segs":[["A mortal kingdom on the Continent. Beyond its existence and its queen, specific geographic details are not fully described."]]}]},{"t":"People","p":[{"segs":[["A mortal kingdom whose queen is cursed and therefore absent for half of every day. How much Scythia’s people know about "],["Vassa","vassa"],["’s curse and what it costs their kingdom to be ruled by someone fighting it simultaneously is not fully documented."]]}]},{"t":"Notable","p":[{"segs":[["Scythia is notable primarily because of its queen — "],["Vassa","vassa"],[" was the only one of the six "],["Mortal Queens","mortal-queens"],[" who refused to betray her people to "],["Hybern","king-of-hybern"],[". Her kingdom reflects that — it is the one mortal realm whose ruler chose her people over personal survival. The curse placed on "],["Vassa","vassa"],[" by "],["Koschei","koschei"],[" keeps her bound to his lake at dawn, transforming her into a firebird until nightfall. Scythia’s future is directly tied to whether "],["Vassa","vassa"],["’s curse can be broken and "],["Koschei","koschei"],[" defeated — an unresolved threat that hangs over the mortal world."]]}]}],"back":["vassa"]},{"id":"bargains","n":"Bargains & Bargain Marks","c":"customs","k":null,"f":1,"d":5,"sub":[["Fae custom and binding magic — Prythian-wide"]],"rows":[],"sec":[{"t":"Nature","p":[{"segs":[["A bargain struck between Fae — or between Fae and mortal — is not merely an agreement. It is a magically binding contract enforced by something older than court law. Breaking a bargain carries consequences that range from debilitating to fatal depending on the terms. Bargains cannot be circumvented through technicality — the magic reads intent as much as language."]]}]},{"t":"The Mark","p":[{"segs":[["When a bargain is struck, a mark appears on the skin of both parties — typically tattooed in appearance, black against skin, unique to the terms of the agreement. The mark is visible to other Fae and signals immediately that a binding agreement is in place. It fades when the bargain is fulfilled or when both parties are released from its terms. It cannot be removed while the bargain stands."]]}]},{"t":"Notable","p":[{"segs":[["Bargains are one of the primary mechanisms of power and leverage in Prythian — used by High Lords, "],["lesser Fae","lesser-fae"],[", and ancient creatures alike. The "],["Suriel","suriel"],[", the "],["Bone Carver","bone-carver"],[", and "],["Bryaxis","bryaxis"],[" have all been bargained with. A bargain with a Fae should never be entered into carelessly. The magic does not care about fairness. It cares about terms."]]}]}],"back":["weavers-cottage"]},{"id":"graysen","n":"Graysen","c":"characters","k":"mortal","f":2,"d":3,"sub":[["Mortal — Former Fiancé of "],["Elain Archeron","elain"]],"rows":[],"sec":[{"t":"Appearance","p":[{"segs":[["Handsome in the way of wealthy mortal men — well-fed, well-dressed, and entirely unremarkable once you know what he is made of."]]}]},{"t":"Personality","p":[{"segs":[["Graysen is not a villain. He is something more mundane and in some ways worse — a man whose love was entirely conditional and who discovered its conditions t
